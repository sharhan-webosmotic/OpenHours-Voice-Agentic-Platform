# ADF Plugin Manifest Schema v1.0
# ─────────────────────────────────────────────────────────────────────────────
# Every plugin must include a plugin.yaml at its root directory.
# Fields marked (required) must be present. All others are optional.
#
# Install a plugin:
#   bash .claude/scripts/install-plugin.sh .claude/plugins/official/my-plugin
#   /install-plugin my-plugin
#
# Test a plugin locally before publishing:
#   bash .claude/scripts/install-plugin.sh .claude/plugins/user/my-plugin
# ─────────────────────────────────────────────────────────────────────────────

# (required) Plugin identity
name: string            # kebab-case, globally unique, e.g. "github-actions"
version: string         # semver, e.g. "1.0.0"
description: string     # One sentence — what this plugin does
author: string          # Author or organization name
compatibility: string   # ADF version range, e.g. "ADF 4.x" or "ADF 5.x+"

# (optional) What this plugin ships
provides:
  skills: []            # List of skill directory names (each must have a SKILL.md)
  hooks: []             # List of hook script filenames (each becomes a .claude/hooks/ entry)
  agents: []            # List of agent markdown filenames
  rules: []             # List of rule markdown filenames

# (optional) Runtime requirements
requires:
  env: []               # Required environment variable names (installer warns if missing)
  tools: []             # Required Claude Code tools, e.g. ["Bash", "WebFetch"]

# (optional) Install lifecycle
install:
  post_install: null    # Path to a script to run after files are copied (relative to plugin root)
                        # Script receives CLAUDE_DIR as $1 and PROJECT_ROOT as $2
