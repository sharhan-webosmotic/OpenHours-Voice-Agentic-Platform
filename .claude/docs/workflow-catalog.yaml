# ADF Workflow Catalog
# Machine-readable SDLC phase progression.
# Used by: /session-management (restore), /project-stage-detect, /gate-enforcement
# Format: phases → steps → required/optional/repeatable, artifact globs, gate triggers

version: "3.0.0"
framework: app-development-framework

phases:

  # ─────────────────────────────────────────────
  # PHASE 1: DISCOVERY
  # Goal: Agree on what we're building and why
  # ─────────────────────────────────────────────
  discovery:
    description: "Agree on scope, estimate effort, classify project type."
    gate_on_exit: "Gate 0 (Project Charter)"
    steps:
      - id: workscope
        skill: /workscope
        required: true
        repeatable: false
        artifact_glob: "AI_DOCS/planning/workscope{.md,/index.md}"
        description: "Generate client-facing scope document from requirements"

      - id: estimation
        skill: /estimation
        required: false
        repeatable: false
        artifact_glob: "AI_DOCS/estimation/estimation-*.{md,xlsx}"
        description: "Estimation workbook and summary (optional): role hours per feature, scope buckets, validation, provisional ETA. Built by /estimation (SK-162 v6)."

      - id: project-types
        skill: /project-types
        required: true
        repeatable: false
        artifact_glob: "AI_DOCS/planning/project-classification.md"
        description: "Classify as POC / MVP / Production-Grade"

      - id: milestone-planning
        skill: /milestone-planning
        required: false
        repeatable: false
        artifact_glob: "AI_DOCS/planning/milestone-plan{.md,/index.md}"
        description: "High-level milestone plan (can be done in specification)"

    completion_check:
      - "AI_DOCS/planning/workscope.md (or AI_DOCS/planning/workscope/index.md) exists"
      - "Gate 0 PASSED (legacy: APPROVED) in AI_DOCS/memory/gate-status.md"

  # ─────────────────────────────────────────────
  # PHASE 2: SPECIFICATION
  # Goal: Frozen tech spec + locked API contract
  # ─────────────────────────────────────────────
  specification:
    description: "Author technical spec, define API contract, plan milestones."
    gate_on_exit: "Gate 1 (Tech Spec + API Lock)"
    steps:
      - id: tech-specification
        skill: /tech-specification
        required: true
        repeatable: false
        artifact_glob: "AI_DOCS/planning/tech-spec.md"
        description: "Complete 23-section technical specification"

      - id: architecture
        skill: /architecture
        required: false
        repeatable: true
        artifact_glob: "AI_DOCS/architecture/adrs/*.md"
        description: "Architecture Decision Records (ADR) for major choices"

      - id: milestone-planning
        skill: /milestone-planning
        required: true
        repeatable: false
        artifact_glob: "AI_DOCS/planning/milestone-plan{.md,/index.md}"
        description: "Dependency-ordered milestones"

      - id: gate-enforcement-1
        skill: /gate-enforcement
        gate_id: "PHASE-GATE"
        gate_number: 1
        required: true
        repeatable: false
        description: "Gate 1: Tech Spec approval + API contract lock"

    completion_check:
      - "AI_DOCS/planning/tech-spec.md exists"
      - "AI_DOCS/architecture/api-contract.md exists"
      - "Gate 1 PASSED (legacy: APPROVED) in AI_DOCS/memory/gate-status.md"
      - "AI_DOCS/memory/gate-status.md contains LOCKED for api-contract"

  # ─────────────────────────────────────────────
  # PHASE 3: DESIGN
  # Goal: Design system + component library ready
  # ─────────────────────────────────────────────
  design:
    description: "Define design system, component library, and UX specs."
    gate_on_exit: "Gate 2 (Design System)"
    steps:
      - id: design-discovery
        skill: /design-discovery
        required: true
        repeatable: false
        artifact_glob: "AI_DOCS/design/design-dna.md"
        description: "Design DNA: tokens, typography, color, spacing"

      - id: prd-generation
        skill: /prd-generation
        required: false
        repeatable: false
        artifact_glob: "AI_DOCS/planning/frd*.md"
        description: "Functional Requirements Document"

      - id: prd-generation
        skill: /prd-generation
        required: false
        repeatable: false
        artifact_glob: "AI_DOCS/planning/prd*.md"
        description: "Product Requirements Document"

      - id: guardrails
        skill: /guardrails
        required: false
        repeatable: false
        artifact_glob: "AI_DOCS/project-guardrails.md"
        description: "Project-specific coding rules and quality gates"

      - id: gate-enforcement-2
        skill: /gate-enforcement
        gate_id: "PHASE-GATE"
        gate_number: 2
        required: true
        repeatable: false
        description: "Gate 2: Design System approval"

    completion_check:
      - "AI_DOCS/design/design-dna.md exists"
      - "AI_DOCS/design/component-registry.md exists"
      - "Gate 2 PASSED (legacy: APPROVED) in AI_DOCS/memory/gate-status.md"

  # ─────────────────────────────────────────────
  # PHASE 4: IMPLEMENTATION
  # Goal: Build the product milestone by milestone
  # ─────────────────────────────────────────────
  implementation:
    description: "Implement features sprint by sprint, with per-session quality gates."
    gate_on_exit: "Gate 1.5 (Code Quality) per session; Gate 3 (Alpha) at Milestone 1 end"
    steps:
      - id: github-ops
        skill: /github-ops
        required: false
        repeatable: false
        artifact_glob: ".github/**"
        description: "Set up branching strategy and PR workflow"

      - id: build
        skill: /build
        required: true
        repeatable: true
        artifact_glob: "src/**"
        description: "Implement features and write production code"

      - id: code-quality
        skill: /code-quality
        required: true
        repeatable: true
        artifact_glob: null
        description: "17-point quality check (Gate 1.5) — run per session/PR"

      - id: change-request
        skill: /change-request
        required: false
        repeatable: true
        artifact_glob: "AI_DOCS/planning/change-impact/CR-*.md"
        description: "Handle mid-flight scope additions"

      - id: gate-enforcement-3
        skill: /gate-enforcement
        gate_id: "PHASE-GATE"
        gate_number: 3
        required: true
        repeatable: false
        description: "Gate 3: Alpha Ready — Milestone 1 complete"

    completion_check:
      - "Core user flows implemented"
      - "Gate 3 PASSED (legacy: APPROVED) in AI_DOCS/memory/gate-status.md"

  # ─────────────────────────────────────────────
  # PHASE 5: TESTING
  # Goal: Test coverage, security review, E2E
  # ─────────────────────────────────────────────
  testing:
    description: "QA testing, security review, E2E validation."
    gate_on_exit: "Gate 4 (Beta Ready)"
    steps:
      - id: qa-testing
        skill: /qa-testing
        required: true
        repeatable: true
        artifact_glob: "tests/**"
        description: "Write tests, run QA, check coverage targets"

      - id: e2e-testing
        skill: /e2e-testing
        required: false
        repeatable: true
        artifact_glob: "tests/e2e/**"
        description: "Playwright E2E tests"

      - id: audit
        skill: /audit
        required: true
        repeatable: false
        artifact_glob: "AI_DOCS/audit/audit-report.md"
        description: "Full OWASP security scan"

      - id: python-testing
        skill: /python-testing
        required: false
        repeatable: true
        artifact_glob: "tests/test_*.py"
        description: "pytest tests for Python services"

      - id: gate-enforcement-4
        skill: /gate-enforcement
        gate_id: "PHASE-GATE"
        gate_number: 4
        required: true
        repeatable: false
        description: "Gate 4: Beta Ready"

    completion_check:
      - "Coverage floor met per rules/testing-rules.md Rule 7 (evidence: AI_DOCS/quality/mavs/qa.json)"
      - "Security review PASSED"
      - "Gate 4 PASSED (legacy: APPROVED) in AI_DOCS/memory/gate-status.md"

  # ─────────────────────────────────────────────
  # PHASE 6: DEPLOYMENT
  # Goal: Ship to production
  # ─────────────────────────────────────────────
  deployment:
    description: "Deployment runbook, release checklist, production go-live."
    gate_on_exit: "Gate 5 (Production Ready)"
    steps:
      - id: deployment-planning
        skill: /deployment-planning
        required: true
        repeatable: false
        artifact_glob: "AI_DOCS/deployment/RUNBOOK_*.md"
        description: "Deployment runbook and release strategy"

      - id: python-deployment
        skill: /python-deployment
        required: false
        repeatable: false
        artifact_glob: "AI_DOCS/deployment/python*.md"
        description: "Python service deployment runbook"

      - id: gate-enforcement-5
        skill: /gate-enforcement
        gate_id: "PHASE-GATE"
        gate_number: 5
        required: true
        repeatable: false
        description: "Gate 5: Production Ready"

    completion_check:
      - "Deployment runbook exists"
      - "Rollback plan documented"
      - "Gate 5 PASSED (legacy: APPROVED) in AI_DOCS/memory/gate-status.md"

  # ─────────────────────────────────────────────
  # PHASE 7: MAINTENANCE
  # Goal: Ongoing iteration, tech debt, changes
  # ─────────────────────────────────────────────
  maintenance:
    description: "Post-launch: change requests, tech debt, audits, monitoring."
    gate_on_exit: "No fixed gate — per-change Gate 1.5"
    repeatable: true
    steps:
      - id: change-request
        skill: /change-request
        required: false
        repeatable: true
        artifact_glob: "AI_DOCS/planning/change-impact/CR-*.md"
        description: "Handle new feature requests post-launch"

      - id: data-migration
        skill: /data-migration
        required: false
        repeatable: true
        artifact_glob: "AI_DOCS/migrations/*.md"
        description: "Database migrations with rollback"

      - id: project-audit
        skill: /project-audit
        required: false
        repeatable: true
        artifact_glob: "AI_DOCS/quality/audit-report.md"
        description: "Full codebase audit for ghost features, drift"

      - id: caching-strategy
        skill: /caching-strategy
        required: false
        repeatable: false
        artifact_glob: "AI_DOCS/architecture/caching*.md"
        description: "Caching layer design"

      - id: analytics
        skill: /analytics
        required: false
        repeatable: false
        artifact_glob: null
        description: "Event tracking and analytics implementation"

# ─────────────────────────────────────────────
# PHASE DETECTION HEURISTICS (used by /project-stage-detect)
# ─────────────────────────────────────────────
detection_heuristics:
  - phase: maintenance
    signals:
      - "AI_DOCS/memory/gate-status.md contains Gate 5 PASSED (legacy: APPROVED)"
      - "Production deployment exists"

  - phase: deployment
    signals:
      - "Gate 4 PASSED (legacy: APPROVED)"
      - "AI_DOCS/deployment/RUNBOOK_*.md exists"

  - phase: testing
    signals:
      - "Gate 3 APPROVED OR tests/ directory exists with content"
      - "Security review not yet done"

  - phase: implementation
    signals:
      - "Gate 2 PASSED (legacy: APPROVED)"
      - "src/ or app/ directory exists with code"

  - phase: design
    signals:
      - "Gate 1 PASSED (legacy: APPROVED)"
      - "AI_DOCS/design/ does not exist or is empty"

  - phase: specification
    signals:
      - "Gate 0 PASSED (legacy: APPROVED)"
      - "AI_DOCS/planning/tech-spec.md does not exist"

  - phase: discovery
    signals:
      - "No gate approvals"
      - "AI_DOCS/planning/workscope.md does not exist"
