skill_name: milestone-validation
skill_id: SK-015
category: core
version: 1.0.0

target_description: |
  Run the full-suite validation at milestone close: 17-point code quality simulation + security review + QA coverage gate + accessibility audit + performance budget check + bundle-size check. Produces a single pass/fail verdict per milestone. Replaces per-feature heavy validation. Use at milestone completion or before promoting to a release branch. Also triggers on: 'Validate milestone', 'Close milestone', 'Milestone gate', 'Milestone validation', 'Full validation', 'Release readiness check', 'Gate 4.5'.
# Likely sibling collisions:
#   - code-quality:     the 17-point check: milestone-validation BUNDLES this
#   - audit:  security check: milestone-validation BUNDLES this too
#   - project-audit:    broad codebase scan: overlaps on "scan for issues"
#   - accessibility-audit: a11y: milestone-validation BUNDLES this
#   - do (Phase 3 plus gate-enforcement Gate 5):     release orchestrator: INVOKES milestone-validation

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Run the milestone validation at close of Milestone 3."
    expected_trigger: true
    rationale: "Direct skill name + 'milestone close' trigger."

  - id: P02
    bucket: positive_direct
    text: "Do the full-suite validation before we promote to the release branch."
    expected_trigger: true
    rationale: "Matches 'use before promoting to a release branch' verbatim."

  - id: P03
    bucket: positive_direct
    text: "Give me the single pass/fail verdict for this milestone."
    expected_trigger: true
    rationale: "Single pass/fail verdict per milestone is this skill's signature output."

  - id: P04
    bucket: positive_direct
    text: "Run the bundled milestone check — code quality, security, QA, a11y, perf, bundle size."
    expected_trigger: true
    rationale: "Names the exact 6-part bundle milestone-validation runs."

  - id: P05
    bucket: positive_direct
    text: "Close out Milestone 2 — run the heavy validation bundle."
    expected_trigger: true
    rationale: "'Heavy validation bundle at milestone close' = milestone-validation's purpose."

  - id: P06
    bucket: positive_direct
    text: "Run the 6-check milestone gate: code quality + security + QA coverage + a11y + perf + bundle-size."
    expected_trigger: true
    rationale: "Explicit 6-check bundle = milestone-validation."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "We need one verdict that says this milestone is shippable or not."
    expected_trigger: true
    rationale: "Single shippable/not-shippable verdict at milestone end = milestone-validation."

  - id: P08
    bucket: positive_paraphrase
    text: "Run everything we need to validate this milestone before release-branch promotion."
    expected_trigger: true
    rationale: "Everything needed to validate milestone pre-release-promotion = milestone-validation."

  - id: P09
    bucket: positive_paraphrase
    text: "Gate this milestone's close with the combined quality + security + a11y + perf check."
    expected_trigger: true
    rationale: "Combined 4-dimension gate at milestone close = milestone-validation."

  - id: P10
    bucket: positive_paraphrase
    text: "Do the aggregate milestone pass/fail instead of per-feature heavy validation."
    expected_trigger: true
    rationale: "'Replaces per-feature heavy validation' is in description."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Milestone 4 is feature-complete — run the full validation suite so we can promote."
    expected_trigger: true
    rationale: "Feature-complete + full validation suite + promotion = milestone-validation."

  - id: P12
    bucket: positive_task_embedded
    text: "Before we cut the release branch, I need the combined code/security/QA/a11y/perf/bundle verdict."
    expected_trigger: true
    rationale: "Combined six-way verdict before release branch = milestone-validation."

  - id: P13
    bucket: positive_task_embedded
    text: "Give me a single pass or fail for this milestone so we know if it ships."
    expected_trigger: true
    rationale: "Single pass/fail shipability verdict = milestone-validation's deliverable."

  - id: P14
    bucket: positive_task_embedded
    text: "Run the 4.5 gate — the heavy cross-cutting validation before release promotion."
    expected_trigger: true
    rationale: "Gate 4.5 is milestone-validation's assigned gate."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Run the milestone gate."
    expected_trigger: true
    rationale: "Short direct trigger."

  - id: P16
    bucket: positive_context_based
    text: "Time for the full-suite validation."
    expected_trigger: true
    rationale: "Full-suite validation at milestone end."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Run the 17-point SonarQube checklist before coding begins."
    expected_trigger: false
    expected_sibling: code-quality
    rationale: "17-point SonarQube alone, pre-coding = code-quality (Gate 1.5), not the milestone bundle."

  - id: P18
    bucket: negative_sibling
    text: "Orchestrate the release pipeline with engineering-lead, qa-lead, and deployment prep."
    expected_trigger: false
    expected_sibling: do
    rationale: "Release orchestration with engineering-lead + deploy prep = do (Phase 3 plus gate-enforcement Gate 5)."

  - id: P19
    bucket: negative_sibling
    text: "Scan the codebase for ghost features and API contract drift."
    expected_trigger: false
    expected_sibling: project-audit
    rationale: "Ghost features + API contract drift = project-audit, not milestone gate."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Create a logo and favicon for the landing page."
    expected_trigger: false
    rationale: "Logo/favicon = image-generation, unrelated."
