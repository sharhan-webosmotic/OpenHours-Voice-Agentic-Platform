skill_name: accessibility-audit
skill_id: SK-014
category: core
version: 1.0.0

target_description: |
  Run a WCAG 2.2 AA accessibility audit on the current frontend: axe-core automated checks + keyboard navigation audit + screen reader spot checks + color contrast verification. Produces AI_DOCS/quality/accessibility-report.md with a pass/fail verdict per WCAG success criterion. Use at milestone boundary, before release, or when a user reports an accessibility issue. Also triggers on: 'A11y check', 'WCAG review', 'Axe scan', 'Keyboard nav audit', 'Screen reader check', 'Contrast check', 'Accessibility test'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Run an accessibility audit on the frontend."
    expected_trigger: true
    rationale: "Matches 'accessibility audit' trigger verbatim."

  - id: P02
    bucket: positive_direct
    text: "Do a WCAG 2.1 AA review of the app."
    expected_trigger: true
    rationale: "WCAG 2.1 AA is the description's headline standard."

  - id: P03
    bucket: positive_direct
    text: "Run axe-core scans and report the violations."
    expected_trigger: true
    rationale: "axe-core automated checks is the first named capability."

  - id: P04
    bucket: positive_direct
    text: "Audit keyboard navigation across all our pages."
    expected_trigger: true
    rationale: "Keyboard navigation audit is an explicit capability."

  - id: P05
    bucket: positive_direct
    text: "Verify color contrast meets WCAG AA everywhere."
    expected_trigger: true
    rationale: "Color contrast verification against WCAG AA is an explicit capability."

  - id: P06
    bucket: positive_direct
    text: "Do a screen reader spot check on the checkout flow."
    expected_trigger: true
    rationale: "Screen reader spot checks listed as an explicit capability."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Make sure the UI is usable for people with disabilities."
    expected_trigger: true
    rationale: "Usability-for-disabilities paraphrases WCAG AA accessibility auditing."

  - id: P08
    bucket: positive_paraphrase
    text: "Check ARIA labels and focus order on the new dashboard."
    expected_trigger: true
    rationale: "ARIA + focus order are core WCAG concerns tested by this skill."

  - id: P09
    bucket: positive_paraphrase
    text: "Can you produce an a11y report with pass/fail per criterion?"
    expected_trigger: true
    rationale: "a11y report with per-criterion pass/fail is the skill's exact output."

  - id: P10
    bucket: positive_paraphrase
    text: "Confirm we're compliant with web accessibility guidelines before we ship."
    expected_trigger: true
    rationale: "Web accessibility guideline compliance check = WCAG audit."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "A user filed a bug that the modal isn't reachable by keyboard — can you verify and do a broader sweep?"
    expected_trigger: true
    rationale: "Keyboard-reachability bug + broader sweep = accessibility-audit use case."

  - id: P12
    bucket: positive_task_embedded
    text: "We're closing out milestone 4 and need the WCAG report before release."
    expected_trigger: true
    rationale: "Milestone boundary + pre-release WCAG report is the skill's primary trigger."

  - id: P13
    bucket: positive_task_embedded
    text: "Legal is asking for proof we meet AA standards on the customer portal."
    expected_trigger: true
    rationale: "AA compliance evidence = accessibility-audit's produced report."

  - id: P14
    bucket: positive_task_embedded
    text: "Our contrast on disabled buttons looks low — can you verify across the whole design system?"
    expected_trigger: true
    rationale: "Color contrast verification across components = explicit capability."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "OK, time for the a11y pass."
    expected_trigger: true
    rationale: "Short 'a11y pass' resolves to accessibility-audit."

  - id: P16
    bucket: positive_context_based
    text: "Now run the axe scan on the release candidate."
    expected_trigger: true
    rationale: "axe scan after context is accessibility-audit's automated check."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Run the 17-point SonarQube checklist on the TypeScript code."
    expected_trigger: false
    expected_sibling: code-quality
    rationale: "SonarQube code-quality checklist is code-quality's deliverable, unrelated to WCAG."

  - id: P18
    bucket: negative_sibling
    text: "Do a security audit for OWASP Top 10 and hardcoded secrets."
    expected_trigger: false
    expected_sibling: audit
    rationale: "OWASP Top 10 + secrets scan is audit, not accessibility-audit."

  - id: P19
    bucket: negative_sibling
    text: "Scan the repo for CVEs and vulnerable dependencies."
    expected_trigger: false
    expected_sibling: audit
    rationale: "CVE/dependency vulnerability scanning belongs to audit."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Translate the landing page copy into Spanish and French."
    expected_trigger: false
    rationale: "Translation/i18n is unrelated to WCAG accessibility auditing."
