skill_name: deployment-planning
skill_id: SK-008
category: core
version: 1.0.0

target_description: |
  Prepare a deployment: validate readiness, plan the deployment strategy (Direct/Rolling/Blue-Green/Canary), generate a copy-paste-ready runbook the user will execute manually. Does NOT deploy. Use when asked to prepare for a go-live, create a release runbook, or plan a deployment window. Pairs with /deployment-execution which runs during the actual deploy. Also triggers on: 'Plan deployment', 'Prepare deployment', 'Create deployment runbook', 'Deployment readiness', 'Pre-deployment validation', 'Plan release', 'Deployment checklist'.
# Likely sibling collisions (HIGH risk: split pair):
#   - deployment-execution: live-deploy assistant: runs DURING the actual deploy
#   - do (Phase 3 plus gate-enforcement Gate 5):         release orchestrator: invokes deployment-planning
#   - milestone-validation: full-suite gate bundle: pre-release-branch promotion
#   - github-ops:           branching/PR/SemVer tagging

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Prepare a deployment runbook for tomorrow's go-live."
    expected_trigger: true
    rationale: "Matches 'create a release runbook' + 'go-live' triggers verbatim."

  - id: P02
    bucket: positive_direct
    text: "Plan the deployment strategy for v3.0 — Blue-Green or Canary?"
    expected_trigger: true
    rationale: "Deployment strategy + Blue-Green/Canary are in the description."

  - id: P03
    bucket: positive_direct
    text: "Validate readiness and plan the deployment window for next Tuesday."
    expected_trigger: true
    rationale: "Validate readiness + plan deployment window = deployment-planning."

  - id: P04
    bucket: positive_direct
    text: "Generate a copy-paste-ready runbook for the prod push."
    expected_trigger: true
    rationale: "Copy-paste-ready runbook = deployment-planning signature."

  - id: P05
    bucket: positive_direct
    text: "Plan the Rolling deployment for the API service."
    expected_trigger: true
    rationale: "Rolling is a named strategy."

  - id: P06
    bucket: positive_direct
    text: "Prepare for go-live — build the runbook but do NOT deploy."
    expected_trigger: true
    rationale: "Prepare + 'do NOT deploy' = deployment-planning (explicit in description)."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Draft the step-by-step deployment document I'll follow during the release window."
    expected_trigger: true
    rationale: "Step-by-step deployment doc = runbook = deployment-planning output."

  - id: P08
    bucket: positive_paraphrase
    text: "Figure out our cutover strategy and write out the deploy procedure."
    expected_trigger: true
    rationale: "Cutover strategy + deploy procedure write-up = deployment-planning."

  - id: P09
    bucket: positive_paraphrase
    text: "Pre-deploy prep — readiness, strategy, runbook, but I'll run the commands myself."
    expected_trigger: true
    rationale: "Pre-deploy prep (user runs) = deployment-planning."

  - id: P10
    bucket: positive_paraphrase
    text: "Write the ops playbook for launching v4."
    expected_trigger: true
    rationale: "Ops playbook for a launch = runbook = deployment-planning."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Release is Friday — I need the full deploy plan including rollback steps and health-check gates."
    expected_trigger: true
    rationale: "Full deploy plan + rollback + health-check gates (all pre-deploy) = deployment-planning."

  - id: P12
    bucket: positive_task_embedded
    text: "Before we schedule the prod push, create the runbook with the chosen deploy strategy."
    expected_trigger: true
    rationale: "Pre-push runbook + strategy = deployment-planning."

  - id: P13
    bucket: positive_task_embedded
    text: "We're doing a Blue-Green on Saturday — write the plan."
    expected_trigger: true
    rationale: "Blue-Green plan authoring = deployment-planning."

  - id: P14
    bucket: positive_task_embedded
    text: "Generate a pre-deploy checklist and readiness review for the release."
    expected_trigger: true
    rationale: "Pre-deploy checklist + readiness review = deployment-planning."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Write the runbook."
    expected_trigger: true
    rationale: "Runbook = deployment-planning's signature output."

  - id: P16
    bucket: positive_context_based
    text: "Plan the deployment."
    expected_trigger: true
    rationale: "Direct skill trigger."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "We're mid-deploy — track my progress, diagnose this failed step, and tell me whether to rollback."
    expected_trigger: false
    expected_sibling: deployment-execution
    rationale: "Mid-deploy live assistance = deployment-execution, not deployment-planning."

  - id: P18
    bucket: negative_sibling
    text: "Orchestrate the release pipeline with engineering-lead, qa-lead, and security-auditor."
    expected_trigger: false
    expected_sibling: do
    rationale: "Release orchestration across multiple agents = do (Phase 3 plus gate-enforcement Gate 5)."

  - id: P19
    bucket: negative_sibling
    text: "Tag v3.0 on main and open the release PR."
    expected_trigger: false
    expected_sibling: github-ops
    rationale: "Git tag + PR = github-ops."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write a PRD for the new loyalty program."
    expected_trigger: false
    rationale: "PRD = prd-generation, unrelated."
