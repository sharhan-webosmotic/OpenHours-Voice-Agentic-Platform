skill_name: design-direction
skill_id: SK-149
category: core
version: 1.0.0

target_description: |
  Render 2-3 live HTML/Tailwind mockups of the Design DNA so the user picks ONE concrete visual direction BEFORE tokens lock, so what they pick is what gets built. Also flags requirement-document gaps and weak UX (wrong control patterns, missing states) as Recommended-vs-Current deltas via the ux-advisor agent. Runs after /design-discovery, before /design-tokens. Triggers on: 'show design directions', 'design samples', 'pick a direction', 'mockups to choose from', 'how should it look'.
# Likely sibling collisions:
#   - design-discovery: the BEFORE phase, captures Design DNA / brand mood (not rendering options)
#   - design-tokens:    the AFTER phase, tokens.json + core components (direction already picked)
#   - image-generation: makes logos/illustrations/asset images (not pick-a-direction mockups)
#   - design-screens:   full production screen inventory + UX flows (not 2-3 sample directions)

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Show me 2-3 design directions to choose from before we lock the tokens."
    expected_trigger: true
    rationale: "Matches 'show design directions' + 'mockups to choose from' + 'before tokens lock' verbatim."

  - id: P02
    bucket: positive_direct
    text: "Render a few live HTML mockups of the design so I can pick one."
    expected_trigger: true
    rationale: "Live HTML mockups to pick one is the skill's headline capability."

  - id: P03
    bucket: positive_direct
    text: "Generate design samples for the dashboard and let me pick a direction."
    expected_trigger: true
    rationale: "'design samples' and 'pick a direction' are named trigger phrases."

  - id: P04
    bucket: positive_direct
    text: "How should this look? Give me a couple of mockups to compare."
    expected_trigger: true
    rationale: "'how should it look' + 'mockups to choose from' are explicit triggers."

  - id: P05
    bucket: positive_direct
    text: "Flag any requirement gaps and weak UX before we build the screens."
    expected_trigger: true
    rationale: "Flagging requirement-document gaps and weak UX is the skill's second job."

  - id: P06
    bucket: positive_direct
    text: "Discovery is done, run the design-direction step."
    expected_trigger: true
    rationale: "Names the skill and its 'after /design-discovery' position."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Mock up two or three visual options of the main screen and I will choose the one we build."
    expected_trigger: true
    rationale: "2-3 options to choose from, and what you pick is what gets built."

  - id: P08
    bucket: positive_paraphrase
    text: "Before we commit to colors and components, let me see a few real clickable concepts side by side."
    expected_trigger: true
    rationale: "Live concepts to choose from BEFORE tokens lock is the exact sequencing."

  - id: P09
    bucket: positive_paraphrase
    text: "Our last build's filters were wrong for the data, review the UX and tell me what to change versus the spec."
    expected_trigger: true
    rationale: "Control-pattern fitness plus a Recommended-vs-Current delta is what the skill emits."

  - id: P10
    bucket: positive_paraphrase
    text: "Give me distinct look-and-feel options as actual HTML, not just a written description."
    expected_trigger: true
    rationale: "Live HTML directions rather than a description is the skill's defining choice."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "The DNA is captured, what is the next step before we lock tokens?"
    expected_trigger: true
    rationale: "Runs after discovery and before tokens, exactly that gap."

  - id: P12
    bucket: positive_task_embedded
    text: "The client wants to see options before we build the UI, set that up."
    expected_trigger: true
    rationale: "Presenting 2-3 directions for the client to pick is the skill."

  - id: P13
    bucket: positive_task_embedded
    text: "I didn't like how the chip filters turned out last time, make sure we pick the right controls up front."
    expected_trigger: true
    rationale: "Control-pattern fitness (the chip-filter mistake) is checked in this step."

  - id: P14
    bucket: positive_task_embedded
    text: "Show the team a calm version, a bold version, and a dense version of the same screen so we can decide."
    expected_trigger: true
    rationale: "2-3 distinct directions of the same screen to decide between."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "DNA's done, now show me the directions."
    expected_trigger: true
    rationale: "After discovery, showing directions is design-direction."

  - id: P16
    bucket: positive_context_based
    text: "Let me pick the look before tokens."
    expected_trigger: true
    rationale: "Pick a direction before tokens lock is the skill's signature."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Capture the Design DNA: brand mood, colors, typography, audience, density."
    expected_trigger: false
    expected_sibling: design-discovery
    rationale: "Capturing the DNA is the discovery phase that precedes rendering directions."

  - id: P18
    bucket: negative_sibling
    text: "Build the production tokens.json and the core Button, Input, and Card components."
    expected_trigger: false
    expected_sibling: design-tokens
    rationale: "tokens.json plus core components is design-tokens, after the direction is chosen."

  - id: P19
    bucket: negative_sibling
    text: "Generate a logo and a hero illustration for the landing page."
    expected_trigger: false
    expected_sibling: image-generation
    rationale: "Logo and illustration generation is image-generation, not pick-a-direction mockups."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write a database migration to add an orders table."
    expected_trigger: false
    rationale: "Schema migration is unrelated to choosing a visual direction."
