skill_name: guardrails
skill_id: SK-006
category: core
version: 1.0.0

target_description: |
  Generate project-specific coding rules and quality standards (80+ rules). Configure ESLint, Prettier, and project guardrails. Use when setting up coding standards or generating project rules. Also triggers on: 'Generate guardrails', 'Project standards'.
# Likely sibling collisions:
#   - code-quality:   runs SonarQube/quality CHECKS on existing code: NOT generating rule files
#   - audit: security audit (OWASP, CVE, secrets scan): NOT coding standards generation
#   - error-handling: runtime error/log setup: NOT lint/formatter configuration
#   - tech-specification: tech-spec authoring: NOT the 80+ rules guardrail document

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Generate the project guardrails document with 80+ rules for our stack."
    expected_trigger: true
    rationale: "Generate guardrails + 80+ rules = description verbatim."

  - id: P02
    bucket: positive_direct
    text: "Set up our coding standards for the new Next.js project."
    expected_trigger: true
    rationale: "Setting up coding standards is a named trigger phrase."

  - id: P03
    bucket: positive_direct
    text: "Configure ESLint and Prettier for this repo."
    expected_trigger: true
    rationale: "ESLint + Prettier configuration = description verbatim."

  - id: P04
    bucket: positive_direct
    text: "Create project-specific quality standards including SEC, QUAL, and TEST rules."
    expected_trigger: true
    rationale: "Project-specific quality standards with rule IDs = guardrails core output."

  - id: P05
    bucket: positive_direct
    text: "Generate the full project-guardrails.md file with rule index and examples."
    expected_trigger: true
    rationale: "Generating project-guardrails.md = guardrails' literal output file."

  - id: P06
    bucket: positive_direct
    text: "Produce the project's rule set covering security, caching, performance, testing, and QA."
    expected_trigger: true
    rationale: "Producing rule set across SEC/CACHE/PERF/TEST/QA = guardrails' 8-section output."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Draft the 'single source of truth' for how we write code on this project."
    expected_trigger: true
    rationale: "Single source of truth coding rules = guardrails' canonical framing."

  - id: P08
    bucket: positive_paraphrase
    text: "Set up the lint + format config and write up our house style rules."
    expected_trigger: true
    rationale: "Lint/format config + house style rules = guardrails' config + ruleset output."

  - id: P09
    bucket: positive_paraphrase
    text: "Spin up the baseline rulebook — SEC-001, QUAL-001, TEST-001 with examples in our stack."
    expected_trigger: true
    rationale: "Baseline rulebook with SEC/QUAL/TEST rule IDs = guardrails' deliverable structure."

  - id: P10
    bucket: positive_paraphrase
    text: "I need an AI-readable coding standards doc that lists all our development rules by ID."
    expected_trigger: true
    rationale: "Rule-indexed coding standards document = guardrails' project-guardrails.md."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "New engineers keep breaking our naming conventions — write up the full standards with examples."
    expected_trigger: true
    rationale: "Full standards document with examples = guardrails generation task."

  - id: P12
    bucket: positive_task_embedded
    text: "We're starting a greenfield project; we need a rule index and linter setup before the first PR."
    expected_trigger: true
    rationale: "Greenfield project rule index + linter setup = guardrails setup phase."

  - id: P13
    bucket: positive_task_embedded
    text: "The team wants a reference doc that says 'use Zod for validation, 98% coverage, no magic numbers' etc."
    expected_trigger: true
    rationale: "Tech-stack-specific reference doc of rules = guardrails' output spec."

  - id: P14
    bucket: positive_task_embedded
    text: "Create the linter config and the rule catalog so PR reviewers can cite QUAL-003 when pushing back."
    expected_trigger: true
    rationale: "Linter config + citable rule catalog = guardrails' combined output."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Generate the guardrails now."
    expected_trigger: true
    rationale: "'Generate guardrails' is this skill's signature verb."

  - id: P16
    bucket: positive_context_based
    text: "Set up the project standards."
    expected_trigger: true
    rationale: "Project standards = guardrails' primary use case."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Run the 17-point SonarQube quality check on the current branch."
    expected_trigger: false
    expected_sibling: code-quality
    rationale: "SonarQube quality CHECK on existing code = code-quality, not rule generation."

  - id: P18
    bucket: negative_sibling
    text: "Scan the repo for hardcoded secrets and OWASP Top 10 issues before deploy."
    expected_trigger: false
    expected_sibling: audit
    rationale: "Secrets + OWASP scan = audit, not coding standards generation."

  - id: P19
    bucket: negative_sibling
    text: "Set up Sentry, structured logging, and React error boundaries across the app."
    expected_trigger: false
    expected_sibling: error-handling
    rationale: "Sentry + error boundaries = error-handling runtime setup, not lint rules."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Draft a marketing email announcing the v2 launch."
    expected_trigger: false
    rationale: "Marketing email drafting is outside the codebase-skills domain entirely."
