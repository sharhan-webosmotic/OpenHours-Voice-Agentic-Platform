skill_name: milestone-planning
skill_id: SK-060
category: core
version: 1.0.0

target_description: |
  Create dependency-ordered milestones, choose development approach, define exit criteria, create git branches. Use when planning milestones, creating a roadmap, or deciding sprint order. Also triggers on: 'Create milestone plan', 'Plan milestones', 'Milestone breakdown', 'Project roadmap'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Create a milestone plan for this project."
    expected_trigger: true
    rationale: "Matches 'planning milestones' trigger verbatim."

  - id: P02
    bucket: positive_direct
    text: "Plan the milestones from the FRD."
    expected_trigger: true
    rationale: "Direct 'plan milestones' phrase from triggers list."

  - id: P03
    bucket: positive_direct
    text: "Build a project roadmap with dependency-ordered milestones."
    expected_trigger: true
    rationale: "Roadmap + dependency-ordered milestones are the description's headline deliverables."

  - id: P04
    bucket: positive_direct
    text: "Define exit criteria for each milestone and create the branches."
    expected_trigger: true
    rationale: "Exit criteria + git branch creation are explicitly listed capabilities."

  - id: P05
    bucket: positive_direct
    text: "Decide the sprint order for the upcoming milestones."
    expected_trigger: true
    rationale: "Matches 'deciding sprint order' trigger verbatim."

  - id: P06
    bucket: positive_direct
    text: "Break the work into milestones with the right development approach."
    expected_trigger: true
    rationale: "Milestone breakdown + choosing development approach are both in scope."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Split the scope into phases ordered by dependency."
    expected_trigger: true
    rationale: "Phases-by-dependency paraphrases dependency-ordered milestones."

  - id: P08
    bucket: positive_paraphrase
    text: "Lay out the sequence of sprints we should tackle and in what order."
    expected_trigger: true
    rationale: "Sequencing sprints paraphrases sprint-order decision."

  - id: P09
    bucket: positive_paraphrase
    text: "Propose iterative vs parallel build tracks for this project."
    expected_trigger: true
    rationale: "Choosing development approach: iterative vs parallel is a milestone-planning decision."

  - id: P10
    bucket: positive_paraphrase
    text: "Give me a gated rollout plan from foundation to launch."
    expected_trigger: true
    rationale: "Gated rollout plan = dependency-ordered milestones with exit criteria."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "FRD is signed off — now slice it into M0, M1, M2 with branch names."
    expected_trigger: true
    rationale: "Post-FRD milestone slicing + branch naming is exactly milestone-planning's role."

  - id: P12
    bucket: positive_task_embedded
    text: "We have 12 weeks; break the work into milestones we can ship incrementally."
    expected_trigger: true
    rationale: "Breaking a timeline into shippable milestones maps to this skill."

  - id: P13
    bucket: positive_task_embedded
    text: "Figure out which parts block which so we can plan milestone order correctly."
    expected_trigger: true
    rationale: "Dependency analysis for milestone ordering is the core description."

  - id: P14
    bucket: positive_task_embedded
    text: "I need a roadmap with exit gates before I can staff the sprints."
    expected_trigger: true
    rationale: "Roadmap + exit gates = milestone-planning output."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Tech spec is approved — what's the milestone plan?"
    expected_trigger: true
    rationale: "Tech-spec-approved context + milestone plan request resolves directly here."

  - id: P16
    bucket: positive_context_based
    text: "OK now plan the milestones."
    expected_trigger: true
    rationale: "Short 'plan the milestones' context prompt matches trigger phrase."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Verify milestone M2 meets its exit criteria and produce a PASS/FAIL verdict."
    expected_trigger: false
    expected_sibling: milestone-validation
    rationale: "Verifying a milestone against exit criteria is milestone-validation, not planning."

  - id: P18
    bucket: negative_sibling
    text: "Check whether the current milestone can be marked complete."
    expected_trigger: false
    expected_sibling: milestone-validation
    rationale: "Completion check is validation, not planning new milestones."

  - id: P19
    bucket: negative_sibling
    text: "Run the gate validation on the finished milestone before we close it."
    expected_trigger: false
    expected_sibling: milestone-validation
    rationale: "Gate validation of a finished milestone is milestone-validation's role."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write a CSS file to style the login button blue."
    expected_trigger: false
    rationale: "CSS styling is unrelated to milestone planning."
