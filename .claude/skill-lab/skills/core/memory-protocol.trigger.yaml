skill_name: memory-protocol
skill_id: SK-000
category: core
version: 1.0.0

target_description: |
  Defines the canonical memory schema every ADF skill reads from and writes to. Use when restoring context, updating project state, managing AI_DOCS/, or designing a new skill. Triggers on: 'Read memory', 'Write memory', 'Restore context', 'Memory sync', 'Capsule loading'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Update the AI_DOCS/memory/ files with the latest project state."
    expected_trigger: true
    rationale: "Direct reference to managing AI_DOCS/memory/ files: the core scope of this skill."

  - id: P02
    bucket: positive_direct
    text: "Write the latest decisions into the memory files."
    expected_trigger: true
    rationale: "Writing decisions memory file is one of the shared memory files this skill manages."

  - id: P03
    bucket: positive_direct
    text: "Sync the tasks memory file with what we finished today."
    expected_trigger: true
    rationale: "Tasks memory file is explicitly in the description's file list."

  - id: P04
    bucket: positive_direct
    text: "Restore context from the memory files."
    expected_trigger: true
    rationale: "Matches 'restoring context' trigger phrase verbatim."

  - id: P05
    bucket: positive_direct
    text: "Update the gates memory file with the latest gate status."
    expected_trigger: true
    rationale: "Gates memory is explicitly listed in this skill's managed files."

  - id: P06
    bucket: positive_direct
    text: "Read the project-context memory file and tell me what's in it."
    expected_trigger: true
    rationale: "Reading the shared project-context memory file is this skill's read-path."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Persist what we just decided so the next session remembers it."
    expected_trigger: true
    rationale: "Persisting decisions for cross-session continuity is precisely this skill's purpose."

  - id: P08
    bucket: positive_paraphrase
    text: "Make sure the shared state files reflect the work completed in this session."
    expected_trigger: true
    rationale: "Shared state files == shared memory files; ensuring they reflect state is an update."

  - id: P09
    bucket: positive_paraphrase
    text: "Flush pending updates into the cross-session memory store."
    expected_trigger: true
    rationale: "Cross-session memory store is the exact scope of this skill."

  - id: P10
    bucket: positive_paraphrase
    text: "I need to record today's architectural decisions somewhere durable."
    expected_trigger: true
    rationale: "Recording decisions into the decisions memory file is this skill's job."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "We just finished the auth milestone — can you capture that in memory so next session picks it up?"
    expected_trigger: true
    rationale: "Capturing milestone completion into memory for continuity is a memory-file update."

  - id: P12
    bucket: positive_task_embedded
    text: "The decisions log is out of date; please reconcile it with the meeting notes I just pasted."
    expected_trigger: true
    rationale: "Reconciling the decisions memory file is exactly what memory-protocol manages."

  - id: P13
    bucket: positive_task_embedded
    text: "Before we end this session, write the pending tasks and open questions into our persistent notes."
    expected_trigger: true
    rationale: "Writing pending tasks into persistent memory is updating the tasks memory file."

  - id: P14
    bucket: positive_task_embedded
    text: "Append today's gate approval to the stored gate history."
    expected_trigger: true
    rationale: "Appending to the gates memory file falls directly under this skill."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now write that to memory."
    expected_trigger: true
    rationale: "Short 'write to memory' maps directly to this skill given prior session context."

  - id: P16
    bucket: positive_context_based
    text: "Sync memory and we're done."
    expected_trigger: true
    rationale: "Memory sync is one of this skill's trigger phrases."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Initialize this repo: run git init, install eslint and prettier, and scaffold the project."
    expected_trigger: false
    expected_sibling: session-management
    rationale: "Repo init, tooling install, and scaffolding belong to session-management, not memory-file management."

  - id: P18
    bucket: negative_sibling
    text: "Pick up where I left off and resume my previous session."
    expected_trigger: false
    expected_sibling: session-management
    rationale: "Session restore is session-management's execution, not mere memory-file manipulation."

  - id: P19
    bucket: negative_sibling
    text: "Generate or refresh CLAUDE.md at the project root so Claude Code loads context on start."
    expected_trigger: false
    expected_sibling: project-context
    rationale: "CLAUDE.md at the project root is project-context's deliverable, not AI_DOCS/memory/ files."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Design a logo for our new brand mark."
    expected_trigger: false
    rationale: "Graphic design is an entirely different domain from memory-file management."
