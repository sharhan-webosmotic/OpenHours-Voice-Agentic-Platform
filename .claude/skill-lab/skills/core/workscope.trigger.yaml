skill_name: workscope
skill_id: SK-072
category: core
version: 1.0.0

target_description: |
  Generate client-facing scope documents from requirement discussions. Reads the requirements baseline when present (confirm instead of re-ask), runs 35 discovery questions, surfaces hidden challenges, recommends tech stack, and writes the canonical 12-section client proposal with per-milestone acceptance criteria. Use when defining project scope, gathering requirements, or creating a scope document. Also triggers on: 'Create workscope', 'Generate workscope', 'Work scope', 'Proposal'.
# Likely sibling collisions:
#   - tech-specification: engineering spec: comes AFTER workscope
#   - prd-generation:     product-side doc, stakeholder facing
#   - prd-generation:     functional requirements (detailed ACs)
#   - brainstorm:         pre-requirements ideation, BEFORE workscope
#   - estimation:         effort/timeline, overlaps with "project scope"

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Create a scope document for this new client project."
    expected_trigger: true
    rationale: "Direct 'scope document' trigger: matches description verbatim."

  - id: P02
    bucket: positive_direct
    text: "Run the 32 discovery questions for the fintech app build."
    expected_trigger: true
    rationale: "32 discovery questions is workscope's signature deliverable."

  - id: P03
    bucket: positive_direct
    text: "Define the project scope for the dashboard engagement."
    expected_trigger: true
    rationale: "Matches 'defining project scope' trigger."

  - id: P04
    bucket: positive_direct
    text: "Gather the requirements from the client call I just had."
    expected_trigger: true
    rationale: "Matches 'gathering requirements' trigger."

  - id: P05
    bucket: positive_direct
    text: "Surface any hidden challenges and recommend a tech stack for this proposal."
    expected_trigger: true
    rationale: "Hidden challenges + tech stack recommendation = named workscope capabilities."

  - id: P06
    bucket: positive_direct
    text: "Generate the client-facing scope doc from our discovery notes."
    expected_trigger: true
    rationale: "Client-facing scope doc is workscope's exact output."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Turn this client meeting transcript into a proposal document."
    expected_trigger: true
    rationale: "Client meeting -> proposal/scope doc = workscope's job."

  - id: P08
    bucket: positive_paraphrase
    text: "I need a quote-ready scope write-up before we send the SOW."
    expected_trigger: true
    rationale: "Quote-ready scope write-up before SOW = workscope output."

  - id: P09
    bucket: positive_paraphrase
    text: "Help me figure out what's in and out of scope for this build."
    expected_trigger: true
    rationale: "In/out of scope definition is workscope's core purpose."

  - id: P10
    bucket: positive_paraphrase
    text: "Draft the engagement's scope of work based on the kickoff call."
    expected_trigger: true
    rationale: "Engagement scope of work = workscope."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Client sent requirements; I need to convert them into a proposal with a tech-stack recommendation."
    expected_trigger: true
    rationale: "Requirements -> proposal + tech stack = workscope pipeline."

  - id: P12
    bucket: positive_task_embedded
    text: "Before we quote this project, let's clarify scope and surface any risky assumptions."
    expected_trigger: true
    rationale: "Pre-quote scope clarification + risks = workscope discovery."

  - id: P13
    bucket: positive_task_embedded
    text: "I have notes from 3 calls — produce a single scope document that covers features, stack, and unknowns."
    expected_trigger: true
    rationale: "Consolidate calls into scope doc covering features/stack/unknowns = workscope."

  - id: P14
    bucket: positive_task_embedded
    text: "Run the discovery questionnaire so we don't miss anything the client implied."
    expected_trigger: true
    rationale: "Discovery questionnaire to catch implicit requirements = 32-question workscope pass."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "OK, let's write the scope doc now."
    expected_trigger: true
    rationale: "Direct 'scope doc' trigger in short form."

  - id: P16
    bucket: positive_context_based
    text: "Run the 32 discovery questions."
    expected_trigger: true
    rationale: "32 discovery questions: unambiguously workscope."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Write the 19-section technical specification with API contracts and DB schema."
    expected_trigger: false
    expected_sibling: tech-specification
    rationale: "19-section tech spec + API contracts + DB schema = tech-specification, not workscope."

  - id: P18
    bucket: negative_sibling
    text: "Explore the business model and customer segments before we commit to building this."
    expected_trigger: false
    expected_sibling: brainstorm
    rationale: "Business model + customer segments pre-commit = brainstorm (before workscope)."

  - id: P19
    bucket: negative_sibling
    text: "Generate the estimation workbook with hours per role for every feature."
    expected_trigger: false
    expected_sibling: estimation
    rationale: "An hours-per-role estimation workbook is estimation, not workscope."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Run an accessibility audit on the staging site before launch."
    expected_trigger: false
    rationale: "Accessibility audit = accessibility-audit skill, unrelated to scoping."
