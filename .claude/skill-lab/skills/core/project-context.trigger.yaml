skill_name: project-context
skill_id: SK-080
category: core
version: 1.0.0

target_description: |
  Generate and maintain CLAUDE.md at project root for instant session context. Use when creating or updating CLAUDE.md, regenerating project context, or after a milestone/gate state change. Also triggers on: 'Create CLAUDE.md', 'Update CLAUDE.md', 'Sync context', 'Project context missing', 'Start new session', 'Regenerate context'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Generate CLAUDE.md at the project root."
    expected_trigger: true
    rationale: "Direct match: generating CLAUDE.md at project root is the headline of the description."

  - id: P02
    bucket: positive_direct
    text: "Update CLAUDE.md with the latest project context."
    expected_trigger: true
    rationale: "'Updating CLAUDE.md' is an explicit trigger in the description."

  - id: P03
    bucket: positive_direct
    text: "Create a CLAUDE.md file for this repo."
    expected_trigger: true
    rationale: "'Creating CLAUDE.md' is a direct trigger phrase."

  - id: P04
    bucket: positive_direct
    text: "Regenerate project context now that Gate 2 just passed."
    expected_trigger: true
    rationale: "'Regenerate project context' after a gate state change: both triggers matched."

  - id: P05
    bucket: positive_direct
    text: "Refresh CLAUDE.md — we just hit the auth milestone."
    expected_trigger: true
    rationale: "Milestone state change is a named trigger for updating CLAUDE.md."

  - id: P06
    bucket: positive_direct
    text: "Maintain the CLAUDE.md at repo root and keep it in sync."
    expected_trigger: true
    rationale: "'Maintain CLAUDE.md' is the other verb used in the description."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "We need a top-level context file Claude Code reads on session start — build it."
    expected_trigger: true
    rationale: "Top-level session-start context file === CLAUDE.md at project root."

  - id: P08
    bucket: positive_paraphrase
    text: "Rebuild the project overview file that loads automatically when a new session begins."
    expected_trigger: true
    rationale: "Auto-loaded project overview file is CLAUDE.md."

  - id: P09
    bucket: positive_paraphrase
    text: "Our CLAUDE.md is stale — rewrite it."
    expected_trigger: true
    rationale: "Rewriting stale CLAUDE.md is an update-CLAUDE.md task."

  - id: P10
    bucket: positive_paraphrase
    text: "Produce the root-level context primer so the next session has instant context."
    expected_trigger: true
    rationale: "Root-level context primer for instant session context is verbatim intent."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Gate 3 just approved — please reflect the new state in the root context file Claude reads."
    expected_trigger: true
    rationale: "After gate state change, refresh CLAUDE.md: both triggers present."

  - id: P12
    bucket: positive_task_embedded
    text: "We renamed the project and changed the stack; the top-level CLAUDE doc needs to match."
    expected_trigger: true
    rationale: "Top-level CLAUDE doc must be updated after a project change."

  - id: P13
    bucket: positive_task_embedded
    text: "Add a CLAUDE.md so new sessions don't have to re-read the whole AI_DOCS tree."
    expected_trigger: true
    rationale: "Creating CLAUDE.md as the session-start bridge is this skill's purpose."

  - id: P14
    bucket: positive_task_embedded
    text: "Milestone 4 closed — regenerate the project summary document at the root."
    expected_trigger: true
    rationale: "Milestone close + regen root project summary = CLAUDE.md regeneration."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now refresh CLAUDE.md."
    expected_trigger: true
    rationale: "Short 'refresh CLAUDE.md' maps directly."

  - id: P16
    bucket: positive_context_based
    text: "Regenerate the root context file."
    expected_trigger: true
    rationale: "Root context file === CLAUDE.md; regenerate is a trigger verb."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Which SDLC phase are we currently in? Scan AI_DOCS and tell me the next skill to run."
    expected_trigger: false
    expected_sibling: project-stage-detect
    rationale: "Phase detection and next-skill recommendation is project-stage-detect's job, not CLAUDE.md generation."

  - id: P18
    bucket: negative_sibling
    text: "Update AI_DOCS/memory/tasks.md with what we finished today."
    expected_trigger: false
    expected_sibling: memory-protocol
    rationale: "Managing AI_DOCS/memory/ files is memory-protocol, not CLAUDE.md at the root."

  - id: P19
    bucket: negative_sibling
    text: "Restore my previous session and bootstrap the repo tooling."
    expected_trigger: false
    expected_sibling: session-management
    rationale: "Session restore + repo bootstrap belongs to session-management."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write a SQL query to count unique users by signup date."
    expected_trigger: false
    rationale: "SQL analytics is unrelated to CLAUDE.md generation."
