skill_name: session-management
skill_id: SK-001
category: core
version: 1.0.0

target_description: |
  Execution skill for initialization, session restore, and developer onboarding. Actually runs git init, settings, scaffolding, quality tooling, and session restoration from prior project state. Use when the ask is 'initialize repo', 'restore my session', 'pick up where I left off', 'set up scaffolding', 'onboard a new dev', or 'bootstrap this project'. Distinct from session-management triage routing (router), memory-protocol (only AI_DOCS/memory files), and guardrails (linter config only). Also triggers on: 'Start new project', 'Restore session', 'Continue', 'Onboard me', 'Kick off'.
# HIGH collision risk with memory-protocol.
# Since v4.32.0 the former project-kickoff triage router is a section of this skill,
# so session-management both asks the triage questions and runs the setup.

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 3
  negative_sibling: 2
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Initialize a new project with git, settings, and quality tooling."
    expected_trigger: true
    rationale: "Matches 'initialize new projects' + 'set up git/settings/quality tooling' exactly."

  - id: P02
    bucket: positive_direct
    text: "Restore my session from last time."
    expected_trigger: true
    rationale: "Matches 'restore sessions' / 'resuming work' triggers."

  - id: P03
    bucket: positive_direct
    text: "Onboard a new developer to this project."
    expected_trigger: true
    rationale: "Matches 'onboard new developers' verbatim."

  - id: P04
    bucket: positive_direct
    text: "Set up the scaffolding and quality tooling for this repo."
    expected_trigger: true
    rationale: "Scaffolding + quality tooling = session-management's setup scope."

  - id: P05
    bucket: positive_direct
    text: "Resume work — pick up where I left off."
    expected_trigger: true
    rationale: "Resume + pick up = session resumption."

  - id: P06
    bucket: positive_direct
    text: "Run the project initialization — git init, settings, scaffolding, tooling."
    expected_trigger: true
    rationale: "Project initialization + named subtasks = session-management."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Get this fresh repo bootstrapped with all our standards applied."
    expected_trigger: true
    rationale: "Bootstrap fresh repo with standards = session-management."

  - id: P08
    bucket: positive_paraphrase
    text: "I'm coming back after two weeks — rehydrate my context and pick up the thread."
    expected_trigger: true
    rationale: "Rehydrate + pick up after break = session restore."

  - id: P09
    bucket: positive_paraphrase
    text: "New teammate just joined — walk them into the codebase with the proper setup."
    expected_trigger: true
    rationale: "New teammate onboarding = session-management."

  - id: P10
    bucket: positive_paraphrase
    text: "Configure the base project: tooling, linters, hooks, and starter files."
    expected_trigger: true
    rationale: "Configure base project (tooling + scaffolding) = session-management."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Cloning a fresh empty repo — run the initialization flow with all the quality hooks wired in."
    expected_trigger: true
    rationale: "Fresh-repo init with quality hooks = session-management."

  - id: P12
    bucket: positive_task_embedded
    text: "I was working on this last week — restore the session state so I can continue."
    expected_trigger: true
    rationale: "Restore session state to continue = session-management."

  - id: P13
    bucket: positive_task_embedded
    text: "Our new hire starts Monday — prepare the project so she can pick it up cold."
    expected_trigger: true
    rationale: "Prepare for new hire to pick up cold = onboarding = session-management."

  - id: P14
    bucket: positive_task_embedded
    text: "Do the repo setup: git hooks, prettier, eslint, the usual scaffolding pass."
    expected_trigger: true
    rationale: "Repo setup with specific tooling = session-management."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Restore the session."
    expected_trigger: true
    rationale: "Direct session-management trigger."

  - id: P16
    bucket: positive_context_based
    text: "Do the project init."
    expected_trigger: true
    rationale: "Project init (the execution, not the router)."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: positive_context_based
    text: "I want to start something new but I'm not sure whether to init fresh, migrate existing code, or AI-enable it — ask me the right questions."
    expected_trigger: true
    rationale: "Asks-me-the-questions triage routing is the Triage Routing section of session-management since v4.32.0."

  - id: P18
    bucket: negative_sibling
    text: "Update the CLAUDE.md at the project root with the latest context."
    expected_trigger: false
    expected_sibling: project-context
    rationale: "CLAUDE.md maintenance = project-context."

  - id: P19
    bucket: negative_sibling
    text: "Manage the AI_DOCS/memory/ files to update tasks, decisions, and gate state."
    expected_trigger: false
    expected_sibling: memory-protocol
    rationale: "AI_DOCS/memory/ file management = memory-protocol."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Generate a PRD for the notifications feature."
    expected_trigger: false
    rationale: "PRD = prd-generation, unrelated."
