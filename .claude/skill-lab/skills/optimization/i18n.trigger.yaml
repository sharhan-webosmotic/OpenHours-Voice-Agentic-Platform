skill_name: i18n
skill_id: SK-034
category: optimization
version: 1.0.0

target_description: |
  Implement multi-language support, translations, RTL layout, and locale-aware formatting. Use when adding internationalization, translations, multi-language, or RTL support. Also triggers on: 'Add translations', 'Localization'.
# Likely sibling collisions:
#   - seo:            hreflang / locale-tagged URL metadata overlap
#   - image-assets:   locale-specific asset variants tangentially
#   - reactjs/nextjs: translation library wiring at framework layer

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Add internationalization to the web app."
    expected_trigger: true
    rationale: "'Internationalization' is the first trigger noun in the description."

  - id: P02
    bucket: positive_direct
    text: "Implement multi-language support for English, Spanish, and Japanese."
    expected_trigger: true
    rationale: "Direct 'multi-language support' phrase: verbatim match."

  - id: P03
    bucket: positive_direct
    text: "Wire up translations for all the UI strings."
    expected_trigger: true
    rationale: "Translations is a named capability in the description."

  - id: P04
    bucket: positive_direct
    text: "Add RTL layout support for Arabic."
    expected_trigger: true
    rationale: "RTL layout is a named capability: verbatim."

  - id: P05
    bucket: positive_direct
    text: "Set up locale-aware date and currency formatting across the app."
    expected_trigger: true
    rationale: "Locale-aware formatting is a named capability."

  - id: P06
    bucket: positive_direct
    text: "Add i18n to the React project."
    expected_trigger: true
    rationale: "'i18n' is the skill's own name and abbreviation for internationalization."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "We're expanding to Germany and Japan — make the UI speak both languages."
    expected_trigger: true
    rationale: "Expanding to multiple languages = multi-language/translations setup."

  - id: P08
    bucket: positive_paraphrase
    text: "Extract all hard-coded English strings into resource files so we can localize."
    expected_trigger: true
    rationale: "String extraction for localization = translations groundwork."

  - id: P09
    bucket: positive_paraphrase
    text: "Make the app flip to right-to-left when the user picks Hebrew or Farsi."
    expected_trigger: true
    rationale: "Right-to-left flip on locale change = RTL layout."

  - id: P10
    bucket: positive_paraphrase
    text: "Format prices, dates, and numbers correctly for each country we ship to."
    expected_trigger: true
    rationale: "Country-specific formatting = locale-aware formatting."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Marketing wants the checkout available in French and Portuguese before Black Friday — can you set that up?"
    expected_trigger: true
    rationale: "Multiple target languages for a flow = translations/multi-language."

  - id: P12
    bucket: positive_task_embedded
    text: "Our product went live in Saudi Arabia and the layout is broken — text aligned wrong, icons flipped."
    expected_trigger: true
    rationale: "Arabic layout breakage = RTL support."

  - id: P13
    bucket: positive_task_embedded
    text: "Add react-i18next and move all labels into the translation JSON."
    expected_trigger: true
    rationale: "i18n library + translation JSON = the skill's primary task."

  - id: P14
    bucket: positive_task_embedded
    text: "Users in Germany are seeing US date formats — fix the localization."
    expected_trigger: true
    rationale: "Fix locale-specific date formatting = locale-aware formatting."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now add translations."
    expected_trigger: true
    rationale: "Short 'add translations' directly hits the description."

  - id: P16
    bucket: positive_context_based
    text: "Set up the locale pipeline."
    expected_trigger: true
    rationale: "Locale pipeline = locale-aware formatting/translations = i18n."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Add hreflang tags and canonical URLs so Google shows the right locale in search results."
    expected_trigger: false
    expected_sibling: seo
    rationale: "hreflang + canonical tags for search = SEO meta, not translation infrastructure."

  - id: P18
    bucket: negative_sibling
    text: "Convert all product photos to WebP and add lazy loading."
    expected_trigger: false
    expected_sibling: image-assets
    rationale: "WebP conversion + lazy loading = image-assets (no language involvement)."

  - id: P19
    bucket: negative_sibling
    text: "Generate Open Graph meta tags and a JSON-LD sitemap for the marketing site."
    expected_trigger: false
    expected_sibling: seo
    rationale: "OG tags + JSON-LD + sitemap = SEO, not i18n."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Scan the repo for hardcoded AWS credentials before we push."
    expected_trigger: false
    rationale: "Secret scanning = audit, unrelated to i18n."
