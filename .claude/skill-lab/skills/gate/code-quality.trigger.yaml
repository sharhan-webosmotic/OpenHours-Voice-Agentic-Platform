skill_name: code-quality
skill_id: SK-071
category: gate
version: 1.0.0

target_description: |
  Run mandatory 17-point SonarQube simulation checklist covering security, reliability, clean code, complexity, testing, and logging. Use before coding begins, before merging PRs, or for Gate 1.5 checks. Also triggers on: 'Code quality check', 'Quality gate', 'SonarQube check', 'Pre-coding review'.
# NOTE: Description overlaps with audit (both mention "security"),
# guardrails (both touch coding rules), and qa-testing (both mention "testing").
# This spec is intentionally tough: expected to expose description-collision
# issues and drive the fix loop.

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Run the 17-point SonarQube checklist on this module."
    expected_trigger: true
    rationale: "17-point SonarQube checklist is this skill's signature deliverable."

  - id: P02
    bucket: positive_direct
    text: "Do the Gate 1.5 code quality check."
    expected_trigger: true
    rationale: "Gate 1.5 is named in the description as this skill's gate."

  - id: P03
    bucket: positive_direct
    text: "Run the pre-coding quality check."
    expected_trigger: true
    rationale: "Matches 'use before coding begins' trigger."

  - id: P04
    bucket: positive_direct
    text: "Quality gate check before we merge this PR."
    expected_trigger: true
    rationale: "Matches 'before merging PRs' trigger and 'quality gate' trigger phrase."

  - id: P05
    bucket: positive_direct
    text: "SonarQube simulation on the new service."
    expected_trigger: true
    rationale: "SonarQube simulation is the core capability named in the description."

  - id: P06
    bucket: positive_direct
    text: "Code quality check — give me the 17-point report."
    expected_trigger: true
    rationale: "Both 'code quality check' and '17-point report' are direct signals."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Before I start writing this, make sure the tech spec passes our quality gate."
    expected_trigger: true
    rationale: "Pre-coding quality gate check: correct domain for code-quality."

  - id: P08
    bucket: positive_paraphrase
    text: "Evaluate this code for reliability, complexity, and maintainability issues."
    expected_trigger: true
    rationale: "Reliability, complexity are explicit in the 17-point checklist; not OWASP territory."

  - id: P09
    bucket: positive_paraphrase
    text: "Can you run the quality bar check before we open the PR?"
    expected_trigger: true
    rationale: "Quality bar check before PR = the Gate 1.5 intent."

  - id: P10
    bucket: positive_paraphrase
    text: "I want a static-analysis-style review across the whole module."
    expected_trigger: true
    rationale: "Static-analysis-style review = SonarQube simulation."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "We're about to start building the payments module — run the pre-code checklist so we don't run into issues later."
    expected_trigger: true
    rationale: "Pre-code checklist = the specific Gate 1.5 use case."

  - id: P12
    bucket: positive_task_embedded
    text: "Before this PR merges, make sure our 17-point code standards are met."
    expected_trigger: true
    rationale: "Pre-merge + 17-point = code-quality."

  - id: P13
    bucket: positive_task_embedded
    text: "Check if this code has duplicate logic, over-long methods, or missing unit coverage."
    expected_trigger: true
    rationale: "Duplicate logic, long methods, coverage = classic SonarQube/code-quality axes."

  - id: P14
    bucket: positive_task_embedded
    text: "Give me a clean-code score for this file before the review meeting."
    expected_trigger: true
    rationale: "Clean-code score = one of the 6 dimensions the 17-point checklist covers."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "OK, time for the Gate 1.5 pass."
    expected_trigger: true
    rationale: "Gate 1.5 is unambiguously this skill."

  - id: P16
    bucket: positive_context_based
    text: "Now run the quality checklist."
    expected_trigger: true
    rationale: "Quality checklist: matches the 17-point checklist terminology."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Check the auth flow for OWASP Top 10 issues."
    expected_trigger: false
    expected_sibling: audit
    rationale: "OWASP Top 10 + auth flow is audit's specific territory, not generic code-quality."

  - id: P18
    bucket: negative_sibling
    text: "Set up ESLint and Prettier configs for the project."
    expected_trigger: false
    expected_sibling: guardrails
    rationale: "Linter/formatter config generation = guardrails; code-quality only evaluates output."

  - id: P19
    bucket: negative_sibling
    text: "Write Jest tests for the user service."
    expected_trigger: false
    expected_sibling: qa-testing
    rationale: "Authoring tests = qa-testing. code-quality evaluates coverage but doesn't write tests."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Generate the logo and favicon for our landing page."
    expected_trigger: false
    rationale: "Image generation is unrelated to code quality."
