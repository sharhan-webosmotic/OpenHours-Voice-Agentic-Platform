skill_name: mcp-connector
skill_id: SK-023
category: infrastructure
version: 1.0.0

target_description: |
  Configure MCP servers for database access, browser verification, and tool connections. Enforces free no-credential servers automatically and gates credentialed ones. Use when setting up MCP servers, connecting databases, accelerating debug/verify, or configuring an MCP. Also triggers on: 'Search', 'Find package', 'Latest version', 'Connect MCP', 'Setup MCP'.
# Likely sibling collisions:
#   - skill-authoring: scaffolds a new framework skill (skill definition files)
#   - skill-router: meta-skill that maps user intents to skills
#     mcp-connector is strictly about wiring MCP server tool endpoints, NOT skill authoring/routing

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Configure an MCP server for our Postgres database."
    expected_trigger: true
    rationale: "Configuring MCP servers for database access: verbatim from description."

  - id: P02
    bucket: positive_direct
    text: "Set up the Figma MCP integration."
    expected_trigger: true
    rationale: "Figma MCP configuration is explicitly named."

  - id: P03
    bucket: positive_direct
    text: "Connect our MongoDB instance via MCP."
    expected_trigger: true
    rationale: "Database access over MCP: a core capability."

  - id: P04
    bucket: positive_direct
    text: "Install and configure a new MCP server for the team."
    expected_trigger: true
    rationale: "MCP server setup is the skill's core purpose."

  - id: P05
    bucket: positive_direct
    text: "Wire up tool connections through MCP."
    expected_trigger: true
    rationale: "Tool connections via MCP is explicitly listed."

  - id: P06
    bucket: positive_direct
    text: "Add an MCP server for BigQuery access."
    expected_trigger: true
    rationale: "Adding a database MCP server: direct match."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "I want Claude to be able to query our Snowflake warehouse — set up whatever server it needs."
    expected_trigger: true
    rationale: "Connecting Claude to a warehouse via an MCP server: same intent."

  - id: P08
    bucket: positive_paraphrase
    text: "Hook up the design files from Figma so the model can read frames directly."
    expected_trigger: true
    rationale: "Figma MCP integration phrased naturally."

  - id: P09
    bucket: positive_paraphrase
    text: "Register a new external tool endpoint using the Model Context Protocol."
    expected_trigger: true
    rationale: "Registering an MCP endpoint is exactly what mcp-connector does."

  - id: P10
    bucket: positive_paraphrase
    text: "Add a connector so I can run read-only SQL from my Claude session."
    expected_trigger: true
    rationale: "Read-only SQL via a connector = database MCP setup."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "The designers published new Figma frames — make sure Claude can pull them in automatically."
    expected_trigger: true
    rationale: "Enabling Claude to pull Figma frames = configuring Figma MCP."

  - id: P12
    bucket: positive_task_embedded
    text: "We want to let Claude introspect our staging DB schema live — what do we need to configure?"
    expected_trigger: true
    rationale: "Live DB introspection for Claude is a database MCP setup."

  - id: P13
    bucket: positive_task_embedded
    text: "Our new intern needs the same MCP servers as everyone else — bring their config up to parity."
    expected_trigger: true
    rationale: "Provisioning MCP servers for a teammate is an mcp-connector task."

  - id: P14
    bucket: positive_task_embedded
    text: "The Linear MCP server isn't responding — help me reconfigure it."
    expected_trigger: true
    rationale: "Configuring/reconfiguring an MCP server is this skill's job."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now add the MCP server."
    expected_trigger: true
    rationale: "Short imperative that directly names MCP server setup."

  - id: P16
    bucket: positive_context_based
    text: "Set up the Figma connector next."
    expected_trigger: true
    rationale: "Figma connector setup is an mcp-connector task."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Scaffold a new framework-compliant skill with the standard metadata and section templates."
    expected_trigger: false
    expected_sibling: skill-authoring
    rationale: "Scaffolding a skill file with SK-NNN metadata is skill-authoring, not MCP server wiring."

  - id: P18
    bucket: negative_sibling
    text: "I'm creating a new reusable skill — generate the SKILL.md frontmatter and body."
    expected_trigger: false
    expected_sibling: skill-authoring
    rationale: "Authoring SKILL.md is skill-authoring's lane."

  - id: P19
    bucket: negative_sibling
    text: "Given this user intent, which skill should I route to?"
    expected_trigger: false
    expected_sibling: skill-router
    rationale: "Intent-to-skill routing is skill-router's role, not MCP configuration."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Compose a haiku about morning coffee."
    expected_trigger: false
    rationale: "Creative writing is unrelated to MCP server configuration."
