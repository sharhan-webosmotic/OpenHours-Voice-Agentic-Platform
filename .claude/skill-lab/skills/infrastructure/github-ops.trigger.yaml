skill_name: github-ops
skill_id: SK-021
category: infrastructure
version: 1.0.0

target_description: |
  Manage git branching (main/develop/staging/milestone-N), the project's chosen branching strategy (1-branch-per-milestone vs per-feature; 2-tier vs 3-tier with staging), commit protocol, PR workflow, SemVer tagging, and releases. Reads AI_DOCS/deployment/git-strategy.md. Use when committing, creating branches, making PRs, merging, promoting, or tagging releases. Also triggers on: 'Push', 'Merge', 'Start milestone', 'Finish milestone', 'Promote to staging'.
# Likely sibling collisions:
#   - build: general day-to-day coding flow (feature/bug work)
#     github-ops is strictly git/branch/PR/tag mechanics

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Create a feat branch off develop for the checkout redesign."
    expected_trigger: true
    rationale: "Branch creation using the feat/develop branching model named in the description."

  - id: P02
    bucket: positive_direct
    text: "Commit these changes following the commit protocol."
    expected_trigger: true
    rationale: "Commit protocol is explicitly named in the description."

  - id: P03
    bucket: positive_direct
    text: "Open a PR from feat/login-flow into develop."
    expected_trigger: true
    rationale: "PR workflow: directly named."

  - id: P04
    bucket: positive_direct
    text: "Tag this release v2.3.0 using SemVer."
    expected_trigger: true
    rationale: "SemVer tagging and releases are named capabilities."

  - id: P05
    bucket: positive_direct
    text: "Merge the milestone-3 branch back into main."
    expected_trigger: true
    rationale: "Merging + milestone-N branch naming are explicit in the description."

  - id: P06
    bucket: positive_direct
    text: "Set up the main/develop/milestone branching strategy for this repo."
    expected_trigger: true
    rationale: "Branching model setup is the skill's core responsibility."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "I need to cut a new branch for this ticket and push my first commit."
    expected_trigger: true
    rationale: "Branch + commit lifecycle: github-ops mechanics."

  - id: P08
    bucket: positive_paraphrase
    text: "Bump the version and cut a release tag."
    expected_trigger: true
    rationale: "Version bump + release tag = SemVer tagging, named capability."

  - id: P09
    bucket: positive_paraphrase
    text: "Can you raise a pull request and follow our usual conventions?"
    expected_trigger: true
    rationale: "Raising a PR with project conventions is PR workflow."

  - id: P10
    bucket: positive_paraphrase
    text: "Fold feat/api-refactor back into develop with a proper merge."
    expected_trigger: true
    rationale: "Merging a feat branch into develop: explicit workflow."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "I've finished the work — commit everything with good messages, push, and open a PR targeting develop."
    expected_trigger: true
    rationale: "Full commit → push → PR flow is the github-ops lane."

  - id: P12
    bucket: positive_task_embedded
    text: "We're releasing tonight — tag v1.8.2 on main and draft the GitHub release notes."
    expected_trigger: true
    rationale: "Tagging + GitHub release is exactly github-ops' job."

  - id: P13
    bucket: positive_task_embedded
    text: "New milestone is starting — create the milestone-4 branch and point develop at it."
    expected_trigger: true
    rationale: "Milestone-N branch creation is named in the branching strategy."

  - id: P14
    bucket: positive_task_embedded
    text: "Squash-merge this PR and delete the feature branch afterward."
    expected_trigger: true
    rationale: "Merge + branch cleanup = PR workflow."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "OK, push it and open the PR."
    expected_trigger: true
    rationale: "Short push/PR command: classic github-ops context prompt."

  - id: P16
    bucket: positive_context_based
    text: "Now tag the release."
    expected_trigger: true
    rationale: "Tag-the-release is a SemVer tagging trigger."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Walk me through the usual feature-build workflow — what's next after the task is picked up?"
    expected_trigger: false
    expected_sibling: build
    rationale: "General day-to-day coding workflow is build, not the git/branch mechanics of github-ops."

  - id: P18
    bucket: negative_sibling
    text: "What's the standard order of operations for implementing a bug fix end-to-end?"
    expected_trigger: false
    expected_sibling: build
    rationale: "End-to-end dev order-of-operations belongs to build."

  - id: P19
    bucket: negative_sibling
    text: "Help me plan how I'm going to approach coding this feature today."
    expected_trigger: false
    expected_sibling: build
    rationale: "Coding approach/plan is build territory, not git operations."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write a marketing email announcing our new pricing tiers."
    expected_trigger: false
    rationale: "Marketing copywriting is unrelated to git operations."
