skill_name: data-migration
skill_id: SK-022
category: infrastructure
version: 1.0.0

target_description: |
  Handle database schema migrations, rollback scripts, data transformation migrations, and DB seeding scripts (up/down SQL, migration files). Use when writing a migration, changing a DB schema, rolling back a DB change, or authoring a seeding script. Do NOT use for generating mock/fake test data or JSON fixtures: use mock-data for that. Also triggers on: 'Database migration', 'Schema change', 'Data migration', 'Seed database'.
# Likely sibling collisions:
#   - codebase-migration: onboard an existing CODEBASE into the framework (code, not data)
#     data-migration is about DB schema/data only; codebase-migration is about repo onboarding
#   - mock-data: fake/mock test data + JSON fixtures (content generation)
#     data-migration is about migration/seed SCRIPTS that run against a DB

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Write a database migration to add a 'deleted_at' column to users."
    expected_trigger: true
    rationale: "Writing a database migration: verbatim from description."

  - id: P02
    bucket: positive_direct
    text: "Create a rollback for last night's schema change."
    expected_trigger: true
    rationale: "Rollback script authoring is an explicit capability."

  - id: P03
    bucket: positive_direct
    text: "Author the DB seed migration that inserts baseline lookup rows into the orders_status table."
    expected_trigger: true
    rationale: "DB seed migration (script that runs against the DB) is a data-migration deliverable."

  - id: P04
    bucket: positive_direct
    text: "Change the schema to split 'name' into first_name/last_name."
    expected_trigger: true
    rationale: "Matches 'changing schemas' trigger phrase."

  - id: P05
    bucket: positive_direct
    text: "Write a data transformation migration to normalize all email addresses to lowercase."
    expected_trigger: true
    rationale: "Data transformation + migration: explicit capability."

  - id: P06
    bucket: positive_direct
    text: "Generate the migration to add a foreign key from orders to customers."
    expected_trigger: true
    rationale: "Migration authoring for a schema change: direct match."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "The new feature needs a 'tags' table — produce the up/down SQL."
    expected_trigger: true
    rationale: "Up/down SQL for a new table is a schema migration."

  - id: P08
    bucket: positive_paraphrase
    text: "Undo the migration we shipped yesterday, cleanly."
    expected_trigger: true
    rationale: "Undoing a shipped migration = rollback script."

  - id: P09
    bucket: positive_paraphrase
    text: "Write the up/down SQL for adding a 'status' enum to the subscriptions table."
    expected_trigger: true
    rationale: "Up/down SQL authoring for a schema change is a DB migration script."

  - id: P10
    bucket: positive_paraphrase
    text: "Backfill the 'country_code' column from existing 'address' strings."
    expected_trigger: true
    rationale: "Backfilling a column from existing data is a data transformation migration."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "We're renaming the 'Organization' model to 'Tenant' — handle the DB side with a safe multi-step migration."
    expected_trigger: true
    rationale: "Multi-step DB rename is precisely a schema migration with safety."

  - id: P12
    bucket: positive_task_embedded
    text: "Staging broke after the schema change — we need to revert the DB to yesterday's shape."
    expected_trigger: true
    rationale: "Reverting a schema change = rollback migration."

  - id: P13
    bucket: positive_task_embedded
    text: "We added a 'role' column — write the migration that backfills defaults and the matching rollback script."
    expected_trigger: true
    rationale: "Schema change + backfill migration + rollback script is core data-migration work."

  - id: P14
    bucket: positive_task_embedded
    text: "GDPR wants historical records anonymized — write the one-off data fix."
    expected_trigger: true
    rationale: "One-off DB-wide anonymization = data transformation migration."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now write the migration."
    expected_trigger: true
    rationale: "Short 'write the migration' command maps directly to this skill."

  - id: P16
    bucket: positive_context_based
    text: "Now generate the rollback migration for that schema change."
    expected_trigger: true
    rationale: "Rollback migration for a schema change is explicitly the rollback-script capability."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Onboard this existing Rails codebase into the AI Skills framework with retroactive specs."
    expected_trigger: false
    expected_sibling: codebase-migration
    rationale: "Onboarding a codebase into the framework is codebase-migration, not database migration."

  - id: P18
    bucket: negative_sibling
    text: "Scan our legacy repo and extract the component registry so we can adopt the framework."
    expected_trigger: false
    expected_sibling: codebase-migration
    rationale: "Repo scanning + component registry extraction is codebase-migration's deliverable."

  - id: P19
    bucket: negative_sibling
    text: "Generate retroactive framework specs for the backend project we already have."
    expected_trigger: false
    expected_sibling: codebase-migration
    rationale: "Retroactive spec generation for an existing codebase is codebase-migration."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Design a logo for our new mobile app."
    expected_trigger: false
    rationale: "Logo design is unrelated to database migrations."
