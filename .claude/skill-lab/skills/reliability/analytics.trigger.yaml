skill_name: analytics
skill_id: SK-043
category: reliability
version: 1.0.0

target_description: |
  Implement event tracking, analytics dashboards, and user behavior monitoring with GA4, PostHog, or Mixpanel. Use when adding analytics, tracking events, or setting up dashboards. Also triggers on: 'Add analytics', 'Track events', 'Setup GA4'.
# Likely sibling collisions:
#   - audit-logs:   compliance who-did-what immutable logs: NOT product analytics
#   - ai-cost-guard: LLM token/cost metrics: NOT end-user behavior metrics
#   - error-handling: Sentry error monitoring: NOT user behavior analytics

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Add GA4 event tracking to the signup flow."
    expected_trigger: true
    rationale: "GA4 event tracking is named verbatim in description."

  - id: P02
    bucket: positive_direct
    text: "Set up PostHog to monitor user behavior on the dashboard."
    expected_trigger: true
    rationale: "PostHog + user behavior monitoring = description verbatim."

  - id: P03
    bucket: positive_direct
    text: "Implement Mixpanel for product analytics."
    expected_trigger: true
    rationale: "Mixpanel + product analytics = description's named providers + purpose."

  - id: P04
    bucket: positive_direct
    text: "Track the button_click_submit event across the app."
    expected_trigger: true
    rationale: "Tracking events is a direct trigger phrase."

  - id: P05
    bucket: positive_direct
    text: "Build an analytics dashboard showing DAU, MAU, and retention."
    expected_trigger: true
    rationale: "Analytics dashboards is a named capability, DAU/MAU are analytics KPIs."

  - id: P06
    bucket: positive_direct
    text: "We're adding analytics to the checkout flow."
    expected_trigger: true
    rationale: "Adding analytics is the description's primary trigger phrase."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "I want to see which features users actually use and where they drop off."
    expected_trigger: true
    rationale: "Feature adoption + drop-off analysis = user behavior analytics."

  - id: P08
    bucket: positive_paraphrase
    text: "Wire up page_view and signup funnel events with a privacy-first tracker."
    expected_trigger: true
    rationale: "Funnel event tracking with privacy provider = analytics (PostHog-style)."

  - id: P09
    bucket: positive_paraphrase
    text: "Instrument the app to capture conversion metrics and user journeys."
    expected_trigger: true
    rationale: "Instrument conversion + journeys = user behavior monitoring."

  - id: P10
    bucket: positive_paraphrase
    text: "Stand up a product dashboard for engagement, retention, and funnel drop-offs."
    expected_trigger: true
    rationale: "Product dashboard with engagement/retention/funnel = analytics dashboards."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Product wants to see which onboarding step loses the most users — set up the measurement."
    expected_trigger: true
    rationale: "Onboarding funnel measurement = analytics instrumentation."

  - id: P12
    bucket: positive_task_embedded
    text: "Marketing needs attribution and campaign ROI data in a weekly report."
    expected_trigger: true
    rationale: "Attribution + campaign ROI dashboards = analytics role-based dashboards."

  - id: P13
    bucket: positive_task_embedded
    text: "We need consent-managed tracking so EU users can opt out before any pageview fires."
    expected_trigger: true
    rationale: "Consent-managed pageview tracking = analytics GDPR consent model."

  - id: P14
    bucket: positive_task_embedded
    text: "Add a tracking plan with event naming conventions for the new feature's flow."
    expected_trigger: true
    rationale: "Tracking plan + event naming = analytics canonical deliverable."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now set up the analytics."
    expected_trigger: true
    rationale: "'Set up analytics' resolves directly to this skill."

  - id: P16
    bucket: positive_context_based
    text: "Add event tracking here."
    expected_trigger: true
    rationale: "Event tracking is the signature analytics phrase."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Record an immutable trail of admin actions for SOC2 compliance."
    expected_trigger: false
    expected_sibling: audit-logs
    rationale: "Immutable SOC2 compliance trail = audit-logs, not product analytics."

  - id: P18
    bucket: negative_sibling
    text: "Estimate monthly token cost for the new Opus-powered feature before we implement it."
    expected_trigger: false
    expected_sibling: ai-cost-guard
    rationale: "LLM token cost estimation = ai-cost-guard, not user behavior analytics."

  - id: P19
    bucket: negative_sibling
    text: "Wire up Sentry to capture uncaught exceptions with structured context."
    expected_trigger: false
    expected_sibling: error-handling
    rationale: "Sentry exception capture = error-handling runtime logging, not analytics."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write a PRD for the new billing feature."
    expected_trigger: false
    rationale: "PRD authoring = prd-generation, unrelated to analytics instrumentation."
