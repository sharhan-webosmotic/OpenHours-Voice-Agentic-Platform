skill_name: error-handling
skill_id: SK-040
category: reliability
version: 1.0.0

target_description: |
  Specialized skill for the error/resilience/logging layer: implement React error boundaries, global error handlers, structured logging (Sentry/Pino/Winston/Bunyan), user-friendly error messages, retry-with-backoff patterns, fallback UI, exception strategy. Use specifically when the task is about error handling, resilience, fallbacks, observability/logging setup, or any failure-path infrastructure. Prefer this OVER build whenever the work is error/logging/resilience-specific: build is for generic coding, this is the error/resilience specialist. Also triggers on: 'Add error handling', 'Error logging'.
# Likely sibling collisions:
#   - debugger:       INVESTIGATES existing errors: error-handling IMPLEMENTS defenses
#   - audit-logs:     immutable compliance audit trail (different logging purpose)
#   - guardrails:     coding rules / linter config: not runtime error handling
#   - build: general coding: implementation is the overlap

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Set up React error boundaries for the dashboard."
    expected_trigger: true
    rationale: "Error boundaries is a named capability in description."

  - id: P02
    bucket: positive_direct
    text: "Implement global error handling across the Next.js app."
    expected_trigger: true
    rationale: "Global error handling = description term verbatim."

  - id: P03
    bucket: positive_direct
    text: "Add structured logging to our API layer."
    expected_trigger: true
    rationale: "Structured logging is a named capability."

  - id: P04
    bucket: positive_direct
    text: "Write user-friendly error messages for the payment flow."
    expected_trigger: true
    rationale: "User-friendly error messages = direct description match."

  - id: P05
    bucket: positive_direct
    text: "Set up error recovery patterns for the form submission flow."
    expected_trigger: true
    rationale: "Error recovery patterns is a named trigger."

  - id: P06
    bucket: positive_direct
    text: "Implement error boundary + fallback UI for the checkout route."
    expected_trigger: true
    rationale: "Error boundary + fallback = error-handling implementation scope."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "I want graceful failures everywhere — show decent messages when API calls break."
    expected_trigger: true
    rationale: "Graceful failures + user-friendly messages = error-handling implementation."

  - id: P08
    bucket: positive_paraphrase
    text: "Add defensive wrappers around our async calls with centralized logging."
    expected_trigger: true
    rationale: "Defensive wrappers + centralized logging = error-handling patterns."

  - id: P09
    bucket: positive_paraphrase
    text: "Harden the app against runtime errors — catch them, log them properly, show useful UI."
    expected_trigger: true
    rationale: "Harden against runtime errors via catch+log+UI = error-handling."

  - id: P10
    bucket: positive_paraphrase
    text: "Put in a proper global exception strategy with good log structure."
    expected_trigger: true
    rationale: "Global exception strategy + log structure = error-handling."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Before go-live, the app needs proper error boundaries on every top-level route."
    expected_trigger: true
    rationale: "Error boundaries on routes = error-handling implementation."

  - id: P12
    bucket: positive_task_embedded
    text: "Users see raw stack traces on failed saves — wrap that with friendly messages and log the real error."
    expected_trigger: true
    rationale: "Replace stack traces with friendly messages + real-error logging = error-handling."

  - id: P13
    bucket: positive_task_embedded
    text: "Sentry's getting noise — add structured logging with contextual fields to our fetch layer."
    expected_trigger: true
    rationale: "Structured logging with context fields = error-handling."

  - id: P14
    bucket: positive_task_embedded
    text: "Build a retry-with-backoff error recovery pattern for our external API calls."
    expected_trigger: true
    rationale: "Retry-with-backoff recovery pattern = error-handling recovery scope."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Add error boundaries."
    expected_trigger: true
    rationale: "Error boundaries is error-handling's signature term."

  - id: P16
    bucket: positive_context_based
    text: "Set up structured logging."
    expected_trigger: true
    rationale: "Structured logging = error-handling."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Something's broken — figure out why the API returns empty data on staging."
    expected_trigger: false
    expected_sibling: debugger
    rationale: "Figure-out-why investigation = debugger, not error-handling."

  - id: P18
    bucket: negative_sibling
    text: "Set up immutable audit trail logging for compliance — who-did-what events."
    expected_trigger: false
    expected_sibling: audit-logs
    rationale: "Immutable compliance audit trail = audit-logs, not runtime error logging."

  - id: P19
    bucket: negative_sibling
    text: "Configure ESLint and Prettier to enforce our coding rules across the repo."
    expected_trigger: false
    expected_sibling: guardrails
    rationale: "ESLint/Prettier coding rules = guardrails, not runtime error handling."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Generate a PDF invoice from order data."
    expected_trigger: false
    rationale: "PDF generation = pdf, unrelated."
