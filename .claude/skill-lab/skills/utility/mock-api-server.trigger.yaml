skill_name: mock-api-server
skill_id: SK-044
category: utility
version: 1.0.0

target_description: |
  Set up a local JSON-persisted mock API server for frontend development before backend is ready. Use when needing a mock API, fake backend, or mock server for frontend work. Also triggers on: 'Setup mock server', 'Run local API', 'Mock CRUD setup', 'JSON API server'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Set up a local mock API server for the frontend team."
    expected_trigger: true
    rationale: "Matches 'set up a local mock API server' trigger phrase verbatim."

  - id: P02
    bucket: positive_direct
    text: "I need a fake backend running locally so the UI can make HTTP calls."
    expected_trigger: true
    rationale: "Fake backend running locally maps directly to this skill."

  - id: P03
    bucket: positive_direct
    text: "Spin up a mock server with JSON persistence for CRUD routes."
    expected_trigger: true
    rationale: "Mock server + JSON persistence + CRUD routes is this skill's exact scope."

  - id: P04
    bucket: positive_direct
    text: "We need a mock API available before backend is ready."
    expected_trigger: true
    rationale: "Mock API before backend is the description's central use case."

  - id: P05
    bucket: positive_direct
    text: "Start a local JSON-persisted API server for frontend development."
    expected_trigger: true
    rationale: "Local JSON-persisted API server matches the description almost word for word."

  - id: P06
    bucket: positive_direct
    text: "Stand up a mock server for frontend work until the real API lands."
    expected_trigger: true
    rationale: "Mock server for frontend work is verbatim trigger phrasing."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Give me a fake REST endpoint I can POST to that saves the data between restarts."
    expected_trigger: true
    rationale: "Fake REST endpoint with persistence is the mock server offering paraphrased."

  - id: P08
    bucket: positive_paraphrase
    text: "Backend isn't done — can we simulate the API locally so UI work isn't blocked?"
    expected_trigger: true
    rationale: "Simulating API locally to unblock UI is the core value proposition."

  - id: P09
    bucket: positive_paraphrase
    text: "I want a small local server that responds with JSON for every endpoint."
    expected_trigger: true
    rationale: "Small local server returning JSON = mock API server."

  - id: P10
    bucket: positive_paraphrase
    text: "Can you wire up a stub server with GET/POST/PUT/DELETE for the resource routes?"
    expected_trigger: true
    rationale: "Stub server with full CRUD verbs is mock-api-server's exact deliverable."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "The React team wants to start building tomorrow but the real API is two weeks out — what do we give them?"
    expected_trigger: true
    rationale: "Unblocking frontend before real backend = mock API server."

  - id: P12
    bucket: positive_task_embedded
    text: "Set up something the Next.js app can hit at /api/users that round-trips correctly across reloads."
    expected_trigger: true
    rationale: "Persistent /api endpoint for Next.js app to hit is mock-api-server's scope."

  - id: P13
    bucket: positive_task_embedded
    text: "We need a development server that mimics the backend contract so Postman requests return realistic payloads."
    expected_trigger: true
    rationale: "Development server mimicking backend contract is the mock-api-server role."

  - id: P14
    bucket: positive_task_embedded
    text: "Can you give us an Express or FastAPI mock that the frontend can hit during development?"
    expected_trigger: true
    rationale: "Tech-specific mock server (Express/FastAPI) is how this skill dispatches."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now run the mock server with that data loaded."
    expected_trigger: true
    rationale: "Running the mock server (after data exists) resolves to this skill."

  - id: P16
    bucket: positive_context_based
    text: "OK, boot the local API so the frontend can start integrating."
    expected_trigger: true
    rationale: "Booting the local API for frontend integration maps here."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Generate 300 fake users and products as JSON fixtures."
    expected_trigger: false
    expected_sibling: mock-data
    rationale: "Generating fixture files is mock-data: no server involved."

  - id: P18
    bucket: negative_sibling
    text: "Create seed data with realistic customer records and their orders."
    expected_trigger: false
    expected_sibling: mock-data
    rationale: "Seed data creation is mock-data's scope, not running a server."

  - id: P19
    bucket: negative_sibling
    text: "Deploy the staging backend to our Kubernetes cluster."
    expected_trigger: false
    expected_sibling: deployment-execution
    rationale: "Deploying a real backend to infra is deployment-execution, not a mock server."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write the end-of-sprint retrospective notes."
    expected_trigger: false
    rationale: "Retro notes are unrelated to mock API servers."
