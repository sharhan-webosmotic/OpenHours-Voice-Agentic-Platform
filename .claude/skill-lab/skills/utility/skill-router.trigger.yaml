skill_name: skill-router
skill_id: SK-086
category: utility
version: 1.0.0

target_description: |
  Meta-discovery skill that answers 'which skill?' questions: a meta-index of all framework skills. Trigger on any question that asks WHICH or WHAT skill handles a topic, or requests a list, map, or catalog of skills. Key phrases: 'which skill for X', 'what skill handles X', 'is there a skill for X', 'list the skills'. The user wants a POINTER, so prefer skill-router over any domain skill named in the prompt. Do NOT use when the user asks to PERFORM the task (e.g. 'run a security review' uses audit), scaffold skills (skill-authoring), or fix skills (skill-improve).
# SPECIAL: skill-router is SessionStart-loaded (not per-prompt invoked). Its trigger specs test
# whether user prompts asking 'which skill?' / 'what skill handles X?' route HERE vs siblings.
# Keep positives focused on explicit skill-discovery; keep siblings tight for skill-authoring,
# skill-improve, skill-test, and session-management triage routing.

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Which skill should I use for database migrations?"
    expected_trigger: true
    rationale: "'Which skill should I use for X' is the exact skill-discovery trigger."

  - id: P02
    bucket: positive_direct
    text: "Tell me the name of the skill that I should be invoking here — don't do the work yet, just the skill name."
    expected_trigger: true
    rationale: "'Name of the skill to invoke, don't do the work' = pure skill-discovery lookup with no domain hook."

  - id: P03
    bucket: positive_direct
    text: "List all available skills in the framework."
    expected_trigger: true
    rationale: "'List available skills' matches the description verbatim."

  - id: P04
    bucket: positive_direct
    text: "Show me the skill map."
    expected_trigger: true
    rationale: "'Show me the skill map' is a direct skill-router trigger."

  - id: P05
    bucket: positive_direct
    text: "I don't know which skill to invoke for this task."
    expected_trigger: true
    rationale: "'I don't know which skill to invoke' = skill-router discovery."

  - id: P06
    bucket: positive_direct
    text: "I want the skill map / index — show me every skill grouped by category."
    expected_trigger: true
    rationale: "Skill map + index + grouped by category = skill-router catalog view (no domain hook)."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "I need to know WHICH skill to use — don't start the work, just point me to the right skill name."
    expected_trigger: true
    rationale: "Pure routing-question framing: 'which skill + don't start the work + skill name': no domain to latch onto."

  - id: P08
    bucket: positive_paraphrase
    text: "Give me the index of skills by category."
    expected_trigger: true
    rationale: "Index / catalog of skills = skill-router's routing knowledge base."

  - id: P09
    bucket: positive_paraphrase
    text: "How do I find the right skill for caching work?"
    expected_trigger: true
    rationale: "'How do I find the right skill for X' = skill-router discovery."

  - id: P10
    bucket: positive_paraphrase
    text: "Give me the routing index — which skill name maps to each kind of task."
    expected_trigger: true
    rationale: "Routing index + skill name mapping = skill-router's meta-dispatch table."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "I need to do SEO audits but I'm not sure if there's already a skill for that."
    expected_trigger: true
    rationale: "'Is there already a skill for X' = skill-discovery."

  - id: P12
    bucket: positive_task_embedded
    text: "Before I scaffold something new, is there an existing skill that does image generation?"
    expected_trigger: true
    rationale: "Check existing skills before authoring new = skill-router lookup."

  - id: P13
    bucket: positive_task_embedded
    text: "I have a task to do but I want to resolve its skill name first — do the routing lookup only, no action."
    expected_trigger: true
    rationale: "Resolve skill name + routing lookup only + no action = skill-router purely."

  - id: P14
    bucket: positive_task_embedded
    text: "Before I do anything, tell me which of our 48 skills is the right one — I just want the skill name."
    expected_trigger: true
    rationale: "'Before I do anything' + 'which of our 48 skills' + 'just the skill name' = skill-router lookup, not execution."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Which ADF skill handles that?"
    expected_trigger: true
    rationale: "ADF-skill-specific question = skill-router (the 'ADF skill' anchor disambiguates from the raw domain task)."

  - id: P16
    bucket: positive_context_based
    text: "Which of our skills covers this?"
    expected_trigger: true
    rationale: "'Which of our skills covers this' = routing lookup (the 'our skills' anchor prevents ambiguity)."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Starting a fresh engagement — ask me the diagnostic questions to pick the right starting skill."
    expected_trigger: false
    expected_sibling: session-management
    rationale: "Diagnostic intake questions to pick a starting SDLC skill = session-management triage routing triage router, not skill-router's static lookup."

  - id: P18
    bucket: negative_sibling
    text: "Scaffold a new skill called lint-report with the standard template."
    expected_trigger: false
    expected_sibling: skill-authoring
    rationale: "Scaffold new skill = skill-authoring, not routing lookup."

  - id: P19
    bucket: negative_sibling
    text: "My workscope skill is failing trigger tests — fix it."
    expected_trigger: false
    expected_sibling: skill-improve
    rationale: "Fix failing skill = skill-improve, not skill-discovery."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Deploy the web app to staging."
    expected_trigger: false
    rationale: "Deployment execution is deployment-execution, unrelated to skill routing."
