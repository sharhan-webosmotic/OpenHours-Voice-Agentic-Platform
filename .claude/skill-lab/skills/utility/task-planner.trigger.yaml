skill_name: task-planner
skill_id: SK-098
category: utility
version: 1.0.0

target_description: |
  Detailed multi-chunk planner for tasks too large to fit a single capsule row. Creates a persistent plan file (planning/tasks/active/(task-slug)/plan.md + chunk-NN-*.md) referenced from a row in the active milestone's tasks.md. Use when /build picks a task whose acceptance is multi-chunk (5+ steps or more than 2 hours). For simpler tasks, /build executes the row directly. Triggers on: 'Fix', 'Build', 'Add', 'Update', 'Migrate', 'Change', 'Improve' when /do determines chunking is needed.
# Likely sibling collisions:
#   - estimation:        hours/spreadsheet: quantifies effort, doesn't plan the work
#   - feature-delivery:  executes an approved plan: AFTER task-planner
#   - build: coding loop: not plan authoring
#   - change-request:    mid-flight spec update: different artifact
#   - session-management: session gate/context: not a task plan
#   - orchestrator:      multi-agent dispatch: not single-task plan

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Plan this task before we write any code."
    expected_trigger: true
    rationale: "'Before writing any code' is a verbatim description phrase; 'plan this task' is the core verb."

  - id: P02
    bucket: positive_direct
    text: "Create a task plan for this requirement in AI_DOCS/planning/tasks/."
    expected_trigger: true
    rationale: "Exact output path named in the description."

  - id: P03
    bucket: positive_direct
    text: "Intake this bug as a task and build a multi-file plan with an index."
    expected_trigger: true
    rationale: "Universal task intake + multi-file plan + index: all in the description."

  - id: P04
    bucket: positive_direct
    text: "Resume the unfinished task from the previous session."
    expected_trigger: true
    rationale: "'Resumes unfinished tasks across sessions' is an explicit capability."

  - id: P05
    bucket: positive_direct
    text: "This refactor is big — split the plan across files to fit the context budget."
    expected_trigger: true
    rationale: "'Splits large plans across files to fit context budget' is verbatim."

  - id: P06
    bucket: positive_direct
    text: "Take in this feature request and produce a persistent plan before implementation."
    expected_trigger: true
    rationale: "Feature intake + persistent plan + pre-implementation all match the description."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "I have a ticket to implement — write down the steps first so we don't lose track."
    expected_trigger: true
    rationale: "'Write steps first' maps to pre-code persistent plan."

  - id: P08
    bucket: positive_paraphrase
    text: "Can you index all our open work items in a planning doc?"
    expected_trigger: true
    rationale: "Index of tasks in planning doc = the AI_DOCS/planning/tasks INDEX."

  - id: P09
    bucket: positive_paraphrase
    text: "Resume the payments rework task plan from yesterday — reopen the plan file in AI_DOCS."
    expected_trigger: true
    rationale: "Explicit 'task plan' + AI_DOCS plan file references the task-planner persistence contract."

  - id: P10
    bucket: positive_paraphrase
    text: "Break this improvement into a structured, saved plan before touching the repo."
    expected_trigger: true
    rationale: "Structured saved plan before touching code = persistent plan pre-implementation."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Fix the flaky login test — but plan it out first."
    expected_trigger: true
    rationale: "'Plan it out first' on a bug fix = task-planner's universal intake."

  - id: P12
    bucket: positive_task_embedded
    text: "I need to tackle a large refactor — please draft a persistent multi-file plan with an index before any code is written."
    expected_trigger: true
    rationale: "Persistent multi-file plan + index + before-any-code reproduces task-planner's exact contract."

  - id: P13
    bucket: positive_task_embedded
    text: "Before I touch any code for the dark-mode toggle feature, create a saved task plan in AI_DOCS/planning/tasks/ with the index updated."
    expected_trigger: true
    rationale: "Explicit AI_DOCS/planning/tasks path + index update = task-planner's exact deliverable."

  - id: P14
    bucket: positive_task_embedded
    text: "I'm about to start a bunch of cleanups; get them all into a task index so nothing is lost."
    expected_trigger: true
    rationale: "'Task index so nothing is lost' = INDEX.md of persistent tasks."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Plan this first."
    expected_trigger: true
    rationale: "'Plan this first' is the universal-intake signature phrase."

  - id: P16
    bucket: positive_context_based
    text: "Save that as a task and continue later."
    expected_trigger: true
    rationale: "Save-as-task + resume-later is task-planner's persistence contract."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Produce an estimation workbook with minimum hours per role for each feature in this scope."
    expected_trigger: false
    expected_sibling: estimation
    rationale: "A role-hours estimation workbook is estimation's exact output, not a task plan."

  - id: P18
    bucket: negative_sibling
    text: "The plan is approved — start implementing feature-by-feature and run the delivery loop."
    expected_trigger: false
    expected_sibling: feature-delivery
    rationale: "Plan-approved execution is feature-delivery's downstream job."

  - id: P19
    bucket: negative_sibling
    text: "Client wants to add a new reporting feature that isn't in the tech spec — handle the CR."
    expected_trigger: false
    expected_sibling: change-request
    rationale: "Mid-flight CR against the tech spec is change-request, not task planning."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Generate marketing copy for our landing page hero section."
    expected_trigger: false
    rationale: "Marketing copywriting: unrelated to task planning."
