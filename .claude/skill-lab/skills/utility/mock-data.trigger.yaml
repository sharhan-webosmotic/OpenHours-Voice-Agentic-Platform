skill_name: mock-data
skill_id: SK-011
category: utility
version: 1.0.0

target_description: |
  Generate realistic test data, seed data, and JSON fixtures with entity relationships. Use when creating mock data, seed data, test fixtures, or fake data for development. Also triggers on: 'Create mock data', 'Mock service', 'Multi-tenant data'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Create mock data for the users and orders entities."
    expected_trigger: true
    rationale: "Matches 'creating mock data' trigger phrase verbatim."

  - id: P02
    bucket: positive_direct
    text: "Generate seed data for the database with related products and categories."
    expected_trigger: true
    rationale: "Seed data with entity relationships is core scope."

  - id: P03
    bucket: positive_direct
    text: "Build JSON fixtures for the test suite."
    expected_trigger: true
    rationale: "JSON fixtures is named explicitly in the description."

  - id: P04
    bucket: positive_direct
    text: "We need fake data for development — a few hundred rows per table."
    expected_trigger: true
    rationale: "Matches 'fake data for development' trigger phrase."

  - id: P05
    bucket: positive_direct
    text: "Produce test fixtures with realistic names, emails, and addresses."
    expected_trigger: true
    rationale: "Test fixtures + realistic data = direct description match."

  - id: P06
    bucket: positive_direct
    text: "Generate mock data that preserves foreign-key relationships across entities."
    expected_trigger: true
    rationale: "Entity relationships is called out explicitly in the description."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "I need sample records to populate the dev database."
    expected_trigger: true
    rationale: "Sample records for dev DB is seed-data phrased differently."

  - id: P08
    bucket: positive_paraphrase
    text: "Can you stub out a dataset of 500 fake customers linked to invoices?"
    expected_trigger: true
    rationale: "Stubbed dataset with linked entities = mock data with relationships."

  - id: P09
    bucket: positive_paraphrase
    text: "Make up some dummy entries for the products table."
    expected_trigger: true
    rationale: "Dummy entries is an everyday synonym for mock/test data."

  - id: P10
    bucket: positive_paraphrase
    text: "Populate the staging database with believable data for demos."
    expected_trigger: true
    rationale: "Believable demo data is the realistic-data use case of this skill."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Before I show the new dashboard to the client, I need about 200 rows of realistic-looking orders."
    expected_trigger: true
    rationale: "Realistic-looking rows for a demo is the mock-data generation task."

  - id: P12
    bucket: positive_task_embedded
    text: "The Jest tests keep failing because the fixtures are empty — can you fill them in?"
    expected_trigger: true
    rationale: "Filling in test fixtures is this skill's core deliverable."

  - id: P13
    bucket: positive_task_embedded
    text: "I want to demo the multi-tenant flow, so generate tenants each with their own users and projects."
    expected_trigger: true
    rationale: "Multi-tenant generation with entity relationships is a named trigger."

  - id: P14
    bucket: positive_task_embedded
    text: "We don't have backend data yet — give me a JSON file with 50 example products so the UI can render."
    expected_trigger: true
    rationale: "JSON file of example records for UI is JSON fixture generation."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now seed the database using those entity relationships."
    expected_trigger: true
    rationale: "Seeding + entity relationships short prompt resolves to this skill."

  - id: P16
    bucket: positive_context_based
    text: "OK, generate the fixtures for all three entities."
    expected_trigger: true
    rationale: "Fixture generation across entities maps directly to mock-data."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Spin up a local CRUD API server the frontend can hit while backend is still being built."
    expected_trigger: false
    expected_sibling: mock-api-server
    rationale: "Running a local mock API server is mock-api-server's scope, not data generation."

  - id: P18
    bucket: negative_sibling
    text: "Start the fake backend on port 3001 so the React app can call GET /users."
    expected_trigger: false
    expected_sibling: mock-api-server
    rationale: "Starting a fake backend server is mock-api-server: mock-data only produces files."

  - id: P19
    bucket: negative_sibling
    text: "Write Jest unit tests for the order-total calculator."
    expected_trigger: false
    expected_sibling: qa-testing
    rationale: "Writing unit tests is qa-testing, not data/fixture generation."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Draft a deployment rollback plan for the production cluster."
    expected_trigger: false
    rationale: "Rollback planning is unrelated to data/fixture generation."
