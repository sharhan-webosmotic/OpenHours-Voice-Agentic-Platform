skill_name: infra-cost-guard
skill_id: SK-146
category: utility
version: 1.0.0

target_description: |
  Infrastructure cost estimation, risk analysis, and written approval gate before any cloud resource is provisioned, resized, or added to a Terraform plan. Calculates per-resource and total monthly cost, flags high-risk patterns (per-AZ NAT, multi-AZ outside production parity, oversized instances, unbounded autoscaling, missing billing alarms), recommends cheaper equivalents, and requires written user approval. Use before terraform apply, any provisioning script, or any deployment plan that adds cloud resources.
# Likely sibling collisions:
#   - ai-cost-guard:       LLM token spend approval: NOT cloud resource cost
#   - infra-planning:      environments/topology/CI-CD plan: NOT the per-apply cost approval gate
#   - deployment-planning: runbook generation for a release: NOT cost estimation/approval

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Estimate the monthly cost of this Terraform plan before we apply it."
    expected_trigger: true
    rationale: "Cost estimation before terraform apply = description verbatim."

  - id: P02
    bucket: positive_direct
    text: "Run a cost and risk analysis on the proposed AWS resources for staging."
    expected_trigger: true
    rationale: "Cost + risk analysis on cloud resources = infra-cost-guard's core role."

  - id: P03
    bucket: positive_direct
    text: "Build the per-resource cost table and get my approval before provisioning anything."
    expected_trigger: true
    rationale: "Per-resource cost table + written approval before provisioning = named capability."

  - id: P04
    bucket: positive_direct
    text: "Flag cost risks in this infra proposal — NAT gateways per AZ, multi-AZ in dev, oversized instances."
    expected_trigger: true
    rationale: "High-risk infra cost patterns named verbatim in description."

  - id: P05
    bucket: positive_direct
    text: "Record a written infra cost approval in the ledger before we create the RDS instance."
    expected_trigger: true
    rationale: "Approval recorded in infra-cost-approvals.md = description verbatim."

  - id: P06
    bucket: positive_direct
    text: "Recommend cheaper equivalents for the resources in this cloud plan."
    expected_trigger: true
    rationale: "Cheaper-equivalent recommendations = named capability (Valkey, gp3, burstable)."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Before I spin up this database instance, what will it cost us per month?"
    expected_trigger: true
    rationale: "Pre-provisioning monthly cost question on a cloud resource = infra-cost-guard."

  - id: P08
    bucket: positive_paraphrase
    text: "Will adding a NAT gateway in every availability zone blow up our AWS bill?"
    expected_trigger: true
    rationale: "Per-AZ NAT cost risk = infra-cost-guard's CRITICAL risk flag."

  - id: P09
    bucket: positive_paraphrase
    text: "Sanity check the spend on this new cache cluster before we create it."
    expected_trigger: true
    rationale: "Pre-create spend sanity check on a cloud resource = infra-cost-guard scope."

  - id: P10
    bucket: positive_paraphrase
    text: "Is our dev environment over-provisioned? Find what we can downsize to save money."
    expected_trigger: true
    rationale: "Right-sizing + idle dev resources = infra-cost-guard optimization pass."

  - id: P11
    bucket: positive_task_embedded
    text: "Finance wants numbers: we are adding a load balancer, a second app instance, and multi-AZ for the database — monthly total?"
    expected_trigger: true
    rationale: "Itemized monthly total for new cloud resources = the Step 2 cost table."

  - id: P12
    bucket: positive_task_embedded
    text: "terraform apply just got blocked by the infra cost gate — sort out the approval so I can re-run it."
    expected_trigger: true
    rationale: "The gate hook names this skill as the unblock path: run it, get approval, append ledger entry."

  - id: P13
    bucket: positive_task_embedded
    text: "The client approved a 50 dollar per month hosting budget — verify this plan stays under it before provisioning."
    expected_trigger: true
    rationale: "Budget-vs-plan verification before provisioning = cost table + delta + approval."

  - id: P14
    bucket: positive_task_embedded
    text: "We are promoting dev to staging next week — re-check the costs and get sign-off for the new environment."
    expected_trigger: true
    rationale: "Environment promotion is a named re-approval trigger."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Run the cost guard on this terraform plan."
    expected_trigger: true
    rationale: "'Cost guard' + terraform plan = this skill's signature pairing."

  - id: P16
    bucket: positive_context_based
    text: "Need approval before provisioning these resources."
    expected_trigger: true
    rationale: "Provisioning approval is infra-cost-guard's gate role."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Estimate the token cost of calling Claude on every user message before we build the chat feature."
    expected_trigger: false
    expected_sibling: ai-cost-guard
    rationale: "LLM token spend = ai-cost-guard, not cloud resource cost."

  - id: P18
    bucket: negative_sibling
    text: "Plan the environments, hosting topology, secrets management, and CI/CD pipeline for the new project."
    expected_trigger: false
    expected_sibling: infra-planning
    rationale: "Full infra plan authoring = infra-planning; the cost guard only gates the spend."

  - id: P19
    bucket: negative_sibling
    text: "Create the deployment runbook for Friday's production release."
    expected_trigger: false
    expected_sibling: deployment-planning
    rationale: "Release runbook = deployment-planning, not cost estimation/approval."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write unit tests for the payment service."
    expected_trigger: false
    rationale: "Test authoring = qa-testing, unrelated to infra cost."
