skill_name: codebase-migration
skill_id: SK-053
category: utility
version: 1.0.0

target_description: |
  Onboard existing codebases into the AI Skills framework. Scan code, generate retroactive specs, extract component registries. Use when migrating an existing project or onboarding a codebase. Also triggers on: 'Migrate project', 'Onboard codebase', 'Scan project'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Onboard this existing codebase into the AI Skills framework."
    expected_trigger: true
    rationale: "Verbatim match: onboarding an existing codebase is the headline of the description."

  - id: P02
    bucket: positive_direct
    text: "Migrate this legacy project into our AI Skills setup."
    expected_trigger: true
    rationale: "'Migrating an existing project' is an explicit trigger in the description."

  - id: P03
    bucket: positive_direct
    text: "Scan the code and generate retroactive specs for it."
    expected_trigger: true
    rationale: "Scan code + generate retroactive specs are verbatim capabilities."

  - id: P04
    bucket: positive_direct
    text: "Extract a component registry from this existing repo."
    expected_trigger: true
    rationale: "Extract component registries is a verbatim capability in the description."

  - id: P05
    bucket: positive_direct
    text: "Onboard a codebase — it's a Rails app built two years ago."
    expected_trigger: true
    rationale: "Onboarding a codebase is the direct trigger phrase."

  - id: P06
    bucket: positive_direct
    text: "Help me bring this existing project under the AI Skills framework."
    expected_trigger: true
    rationale: "Bringing existing project under AI Skills framework === onboarding."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Reverse-engineer specs from the existing source so we can manage this with skills."
    expected_trigger: true
    rationale: "Reverse-engineer specs === retroactive spec generation."

  - id: P08
    bucket: positive_paraphrase
    text: "Inventory the components and pages in this legacy repo for our framework."
    expected_trigger: true
    rationale: "Inventorying components === extracting component registries."

  - id: P09
    bucket: positive_paraphrase
    text: "We acquired this codebase from another team; fold it into our AI-driven workflow."
    expected_trigger: true
    rationale: "Folding acquired codebase into AI workflow === codebase migration."

  - id: P10
    bucket: positive_paraphrase
    text: "Reconstruct documentation and specs from the source of this old project."
    expected_trigger: true
    rationale: "Reconstructing specs from source is retroactive spec generation."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Our client handed us a 3-year-old Next.js app and wants us to manage it going forward — walk me through absorbing it into our system."
    expected_trigger: true
    rationale: "Absorbing an existing app into our AI Skills system === codebase migration."

  - id: P12
    bucket: positive_task_embedded
    text: "We need a tech-spec for this existing app, but nothing was ever documented. Derive it from the code."
    expected_trigger: true
    rationale: "Deriving specs from existing code is retroactive spec generation."

  - id: P13
    bucket: positive_task_embedded
    text: "Build a component registry by scanning what's already in src/components."
    expected_trigger: true
    rationale: "Building component registry by scanning existing code is this skill's explicit capability."

  - id: P14
    bucket: positive_task_embedded
    text: "This repo was built without our skills framework — retrofit it so our skills can drive it."
    expected_trigger: true
    rationale: "Retrofitting a pre-existing repo into the framework === onboarding/migration."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now migrate this codebase."
    expected_trigger: true
    rationale: "Short 'migrate codebase' maps directly."

  - id: P16
    bucket: positive_context_based
    text: "OK, onboard the repo."
    expected_trigger: true
    rationale: "Onboard the repo maps directly to codebase onboarding."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "I want to start something new but I'm not sure whether to brainstorm first, init a repo, or migrate an old one — ask me the right questions."
    expected_trigger: false
    expected_sibling: session-management
    rationale: "Genuinely ambiguous starting path: the triage router (session-management triage routing) should handle it, not a specific path."

  - id: P18
    bucket: negative_sibling
    text: "Kick off a new engagement and triage which workflow fits: fresh build, migration, or ideation."
    expected_trigger: false
    expected_sibling: session-management
    rationale: "Triage across multiple paths (including migration) is session-management triage routing's dispatcher role."

  - id: P19
    bucket: negative_sibling
    text: "Initialize a brand-new empty repo with git init, eslint, and scaffolding."
    expected_trigger: false
    expected_sibling: session-management
    rationale: "Fresh init of an empty repo is session-management, not migration of an existing codebase."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "What's the best way to brew a cup of pour-over coffee?"
    expected_trigger: false
    rationale: "Coffee brewing is unrelated to codebase migration."
