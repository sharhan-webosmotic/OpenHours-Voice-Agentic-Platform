skill_name: project-types
skill_id: SK-012
category: utility
version: 1.0.0

target_description: |
  Classify projects as POC, MVP, or Production-Grade and set appropriate rigor levels for testing, security, and quality. Use when determining project type or setting quality standards. Also triggers on: 'What type of project', 'POC or MVP'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Classify this project as POC, MVP, or Production-Grade."
    expected_trigger: true
    rationale: "Matches the description's core classification scheme verbatim."

  - id: P02
    bucket: positive_direct
    text: "What project type is this — POC or MVP?"
    expected_trigger: true
    rationale: "Matches 'determining project type' trigger phrase and names the classifications."

  - id: P03
    bucket: positive_direct
    text: "Set the quality standards for this engagement."
    expected_trigger: true
    rationale: "Matches 'setting quality standards' trigger phrase."

  - id: P04
    bucket: positive_direct
    text: "Decide the rigor level for testing and security on this project."
    expected_trigger: true
    rationale: "Rigor level for testing/security is the description's main output."

  - id: P05
    bucket: positive_direct
    text: "Is this Production-Grade, and what does that imply for our coverage targets?"
    expected_trigger: true
    rationale: "Production-Grade classification + downstream rigor targets is this skill's scope."

  - id: P06
    bucket: positive_direct
    text: "Help me determine the project type before we pick a process."
    expected_trigger: true
    rationale: "Determining project type is a verbatim trigger phrase."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Is this more of a throwaway prototype or a long-lived product?"
    expected_trigger: true
    rationale: "Throwaway prototype vs long-lived product = POC vs Production-Grade classification."

  - id: P08
    bucket: positive_paraphrase
    text: "How strict should our testing and security bars be for this build?"
    expected_trigger: true
    rationale: "Strictness bar for testing/security is the rigor-level output."

  - id: P09
    bucket: positive_paraphrase
    text: "Sort this engagement into the right tier so we know how much polish it needs."
    expected_trigger: true
    rationale: "Tier sorting + polish level is the POC/MVP/Production classification."

  - id: P10
    bucket: positive_paraphrase
    text: "What level of engineering discipline should we apply here?"
    expected_trigger: true
    rationale: "Engineering discipline level is the rigor/quality-standards output."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "The client only wants to prove the concept in 2 weeks — how much QA and security rigor should I plan for?"
    expected_trigger: true
    rationale: "POC classification with downstream rigor-level recommendation is this skill."

  - id: P12
    bucket: positive_task_embedded
    text: "Before I scope the sprint, tell me what bucket this project falls into so I pick the right process."
    expected_trigger: true
    rationale: "Bucket classification drives process selection: project-types' decision output."

  - id: P13
    bucket: positive_task_embedded
    text: "We need to decide coverage targets, but first figure out whether this is an MVP or production."
    expected_trigger: true
    rationale: "MVP vs production classification drives coverage targets: project-types."

  - id: P14
    bucket: positive_task_embedded
    text: "Stakeholders are arguing over whether to over-engineer this — help me set the right quality bar."
    expected_trigger: true
    rationale: "Quality-bar setting based on project type is this skill."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now classify the project and set the rigor level."
    expected_trigger: true
    rationale: "Classify + rigor is the short-form version of project-types' core output."

  - id: P16
    bucket: positive_context_based
    text: "OK, pick the quality tier for this one."
    expected_trigger: true
    rationale: "Quality tier selection maps to project-types' classification."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Write the 19-section technical specification with API contracts and DB schemas."
    expected_trigger: false
    expected_sibling: tech-specification
    rationale: "Tech-spec authoring with API contracts is tech-specification, not project classification."

  - id: P18
    bucket: negative_sibling
    text: "The user is unsure how to start — triage whether this is fresh init, migration, or ideation."
    expected_trigger: false
    expected_sibling: session-management
    rationale: "Ambiguous start-path triage is session-management triage routing's router role, not project-types."

  - id: P19
    bucket: negative_sibling
    text: "Define a TypeScript interface for the Order and Customer entities."
    expected_trigger: false
    expected_sibling: tech-specification
    rationale: "TypeScript type/interface authoring belongs with tech-spec/typings, not project-types classification."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Generate avatar images for five team-member profiles."
    expected_trigger: false
    rationale: "Image generation is unrelated to project-type classification."
