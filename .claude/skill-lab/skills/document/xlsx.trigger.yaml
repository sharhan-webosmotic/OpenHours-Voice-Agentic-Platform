skill_name: xlsx
skill_id: SK-108
category: document
version: 1.0.0

target_description: |
  Use this skill any time a spreadsheet file is the primary input or output: creating, reading, editing .xlsx/.xlsm/.csv/.tsv files, adding columns, computing formulas, formatting, charting, cleaning messy data, or converting between tabular formats. Also triggers on: 'Create spreadsheet', 'Create Excel', 'Edit xlsx', 'Excel file', 'CSV processing'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Create an .xlsx spreadsheet with SUM formulas across the totals column."
    expected_trigger: true
    rationale: ".xlsx + computing formulas are both verbatim in the description."

  - id: P02
    bucket: positive_direct
    text: "Read this .csv file and add a derived column for profit margin."
    expected_trigger: true
    rationale: "Reading .csv + adding columns are named capabilities."

  - id: P03
    bucket: positive_direct
    text: "Edit this .xlsm workbook to fix the broken VLOOKUP formulas."
    expected_trigger: true
    rationale: ".xlsm editing + formulas are directly in the description."

  - id: P04
    bucket: positive_direct
    text: "Clean up this messy sales data spreadsheet — dedupe rows and standardize dates."
    expected_trigger: true
    rationale: "Cleaning messy data is named verbatim."

  - id: P05
    bucket: positive_direct
    text: "Add a bar chart to the revenue worksheet."
    expected_trigger: true
    rationale: "Charting is a named capability."

  - id: P06
    bucket: positive_direct
    text: "Convert this .tsv file into a formatted .xlsx workbook."
    expected_trigger: true
    rationale: "Converting between tabular formats is named, and covers both .tsv and .xlsx."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Build an Excel workbook with conditional formatting on the budget rows."
    expected_trigger: true
    rationale: "Excel workbook + formatting = .xlsx editing."

  - id: P08
    bucket: positive_paraphrase
    text: "Compute quarterly totals in this spreadsheet using Excel formulas."
    expected_trigger: true
    rationale: "Computing formulas in a spreadsheet is directly named."

  - id: P09
    bucket: positive_paraphrase
    text: "Parse the tab-separated file and reshape it into a pivot-style sheet."
    expected_trigger: true
    rationale: "Tab-separated = .tsv; reshaping into a sheet is xlsx's role."

  - id: P10
    bucket: positive_paraphrase
    text: "Generate an Excel deliverable with ratio calculations and a chart."
    expected_trigger: true
    rationale: "Excel output with calculations + chart = xlsx."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Finance needs a monthly expense model with formulas, not hardcoded numbers — deliver as .xlsx."
    expected_trigger: true
    rationale: "xlsx as financial model with formulas is the skill's canonical role."

  - id: P12
    bucket: positive_task_embedded
    text: "The raw export from the CRM is full of inconsistent date formats — get it into a usable sheet."
    expected_trigger: true
    rationale: "Cleaning messy tabular data is xlsx's role."

  - id: P13
    bucket: positive_task_embedded
    text: "We need the quarterly results in a .xlsx with charts by region."
    expected_trigger: true
    rationale: ".xlsx output with charts = xlsx creation."

  - id: P14
    bucket: positive_task_embedded
    text: "Take this CSV and enrich it with a calculated growth-rate column before we send it to the analyst."
    expected_trigger: true
    rationale: "CSV + adding calculated column is xlsx-skill territory."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now add a chart showing monthly trend."
    expected_trigger: true
    rationale: "Charting in a spreadsheet context = xlsx."

  - id: P16
    bucket: positive_context_based
    text: "Export the final results as an Excel file with formulas intact."
    expected_trigger: true
    rationale: "Excel export with formulas is xlsx's role."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Generate 500 rows of fake user records for load testing the API."
    expected_trigger: false
    expected_sibling: mock-data
    rationale: "Fabricating synthetic test records is mock-data's role, not spreadsheet editing."

  - id: P18
    bucket: negative_sibling
    text: "Build a slide deck with quarterly revenue charts for the board."
    expected_trigger: false
    expected_sibling: pptx
    rationale: "Slide deck with charts is pptx, not xlsx."

  - id: P19
    bucket: negative_sibling
    text: "Create a Word report summarizing this quarter's results with headings."
    expected_trigger: false
    expected_sibling: docx
    rationale: "Word report = docx, not spreadsheet."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Design a new landing page hero section with Tailwind."
    expected_trigger: false
    rationale: "UI landing page design is unrelated to spreadsheet manipulation."
