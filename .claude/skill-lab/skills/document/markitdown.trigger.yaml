skill_name: markitdown
skill_id: SK-049
category: document
version: 1.0.0

target_description: |
  Convert / ingest / read ANY supported file or URL into Markdown for LLM consumption: PDF, Word (.docx), Excel (.xlsx), PowerPoint (.pptx), images (OCR), audio (transcription), HTML, CSV/JSON/XML, ZIP archives, YouTube URLs, EPub. Use whenever you need to read, extract text from, or ingest a document/binary before reasoning over it. Also triggers on: 'ingest this file', 'read this document', 'extract text from', 'convert to markdown', 'what does this PDF say', 'summarize this file'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Convert this PDF to markdown so I can read it."
    expected_trigger: true
    rationale: "Converting a file to markdown is the core capability."

  - id: P02
    bucket: positive_direct
    text: "Ingest this Word document and give me the text."
    expected_trigger: true
    rationale: "Ingesting a document for its content is markitdown's role."

  - id: P03
    bucket: positive_direct
    text: "Extract the text from this scanned image."
    expected_trigger: true
    rationale: "Image OCR text extraction is a named source type."

  - id: P04
    bucket: positive_direct
    text: "Read this .epub and turn it into markdown."
    expected_trigger: true
    rationale: "EPub to markdown is directly supported."

  - id: P05
    bucket: positive_direct
    text: "Transcribe this audio file to text."
    expected_trigger: true
    rationale: "Audio transcription is a named source type."

  - id: P06
    bucket: positive_direct
    text: "Get the transcript of this YouTube video as markdown."
    expected_trigger: true
    rationale: "YouTube URL ingestion is explicitly supported."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "What does this Excel spreadsheet say? Just dump it as a table I can read."
    expected_trigger: true
    rationale: "Reading a spreadsheet's content as markdown = ingest path."

  - id: P08
    bucket: positive_paraphrase
    text: "Pull the readable content out of this HTML page."
    expected_trigger: true
    rationale: "HTML to readable markdown is supported."

  - id: P09
    bucket: positive_paraphrase
    text: "Flatten this CSV into something I can skim in chat."
    expected_trigger: true
    rationale: "CSV to markdown table is a data-type conversion."

  - id: P10
    bucket: positive_paraphrase
    text: "Open this zip of reports and make their contents readable."
    expected_trigger: true
    rationale: "ZIP iteration + conversion is supported."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "The client emailed a 40-page PDF spec — I need its content before we plan."
    expected_trigger: true
    rationale: "Needing a document's content for reasoning is the ingest trigger."

  - id: P12
    bucket: positive_task_embedded
    text: "Summarize this pitch deck for me."
    expected_trigger: true
    rationale: "Summarizing requires first ingesting the deck to markdown."

  - id: P13
    bucket: positive_task_embedded
    text: "I have a folder of JSON exports — get them into a form the model can read."
    expected_trigger: true
    rationale: "JSON to readable markdown is a data-type ingest."

  - id: P14
    bucket: positive_task_embedded
    text: "Answer questions about this invoice image."
    expected_trigger: true
    rationale: "Q&A over an image requires OCR ingest first."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now read that .docx and tell me the key points."
    expected_trigger: true
    rationale: "Reading a docx for content routes to the ingest path."

  - id: P16
    bucket: positive_context_based
    text: "Ingest it first, then we'll analyze."
    expected_trigger: true
    rationale: "Explicit ingest request for a supplied file."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Create a new Word document with a table of contents and headings."
    expected_trigger: false
    expected_sibling: docx
    rationale: "Creating an office file is the docx skill, not the read/ingest path."

  - id: P18
    bucket: negative_sibling
    text: "Edit the SUM formulas in this Excel workbook and recalc."
    expected_trigger: false
    expected_sibling: xlsx
    rationale: "Editing cell formulas is xlsx (openpyxl), not markitdown."

  - id: P19
    bucket: negative_sibling
    text: "Write a README in markdown from scratch for this repo."
    expected_trigger: false
    expected_sibling: markdown-creator
    rationale: "Authoring markdown from scratch is markdown-creator, not file conversion."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Set up a Redis cache layer for the API."
    expected_trigger: false
    rationale: "Caching infrastructure is unrelated to file ingestion."
