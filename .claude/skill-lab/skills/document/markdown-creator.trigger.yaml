skill_name: markdown-creator
skill_id: SK-106
category: document
version: 1.0.0

target_description: |
  Generate well-structured Markdown documents that follow best practices: correct heading hierarchy, GitHub-flavored callouts, accessible links and images, fenced code blocks with language tags, sane tables, and folder-based splits. Use when the user asks for a Markdown file, doc, spec, runbook, or README-style page, or any skill needs to emit .md content for humans and agents. Also triggers on: 'write a markdown', 'create a markdown', 'format this as markdown', 'markdown runbook', 'markdown table'.
# Likely sibling collisions:
#   - prd-generation:      PRD is a specific doc type: use prd-generation
#   - tech-specification:  tech spec is a specific doc type: use tech-specification
#   - pdf / docx:          converts markdown → other formats, not authoring
#   - project-context:     regenerates CLAUDE.md: use project-context
#   - retrospective:       specific doc type

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Write a Markdown file that documents our API endpoints."
    expected_trigger: true
    rationale: "'Write a markdown file' is the primary trigger phrase."

  - id: P02
    bucket: positive_direct
    text: "Create a well-structured Markdown document for the onboarding guide."
    expected_trigger: true
    rationale: "Verbatim 'well-structured Markdown document' phrasing."

  - id: P03
    bucket: positive_direct
    text: "Draft a README-style page for this tool."
    expected_trigger: true
    rationale: "README-style page is named verbatim in the description."

  - id: P04
    bucket: positive_direct
    text: "Generate a Markdown runbook for the weekly deploy."
    expected_trigger: true
    rationale: "Markdown runbook named verbatim."

  - id: P05
    bucket: positive_direct
    text: "Format this content as a Markdown doc with proper headings and code blocks."
    expected_trigger: true
    rationale: "Markdown doc + heading hierarchy + code blocks = exact description."

  - id: P06
    bucket: positive_direct
    text: "Turn these notes into an .md file with tables and callouts."
    expected_trigger: true
    rationale: "md file + tables + callouts match named best practices."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Document the CLI flags in something other engineers can read on GitHub."
    expected_trigger: true
    rationale: "GitHub-readable documentation = GitHub-flavored Markdown."

  - id: P08
    bucket: positive_paraphrase
    text: "I have a plain-text spec — reformat it with proper H1/H2 hierarchy, fenced code, and a TOC."
    expected_trigger: true
    rationale: "Heading hierarchy + fenced code = markdown-creator's best practices."

  - id: P09
    bucket: positive_paraphrase
    text: "Produce a troubleshooting guide in markdown that team members can skim."
    expected_trigger: true
    rationale: "Skimmable markdown guide = best-practice md generation."

  - id: P10
    bucket: positive_paraphrase
    text: "Write the contribution guidelines as a single .md page with sensible sections."
    expected_trigger: true
    rationale: "Contribution guidelines as structured .md = markdown-creator."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "We need an on-call playbook — draft it in markdown with callouts for CRITICAL steps."
    expected_trigger: true
    rationale: "Playbook + markdown + callouts = named capability."

  - id: P12
    bucket: positive_task_embedded
    text: "Convert this meeting transcript into a clean Markdown doc with decisions and action items sections."
    expected_trigger: true
    rationale: "Clean Markdown doc with sections = markdown authoring."

  - id: P13
    bucket: positive_task_embedded
    text: "The onboarding page is 900 lines — split it per the folder rule and keep each file under 300 lines."
    expected_trigger: true
    rationale: "300-line cap + folder splits are named in the description verbatim."

  - id: P14
    bucket: positive_task_embedded
    text: "Build a FAQ document in markdown with anchored links and a summary table at the top."
    expected_trigger: true
    rationale: "Markdown FAQ + anchored links + table = markdown-creator output."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now write it up as a markdown doc."
    expected_trigger: true
    rationale: "Direct 'markdown doc' trigger after preceding context."

  - id: P16
    bucket: positive_context_based
    text: "Format that as a .md file with sections and a table."
    expected_trigger: true
    rationale: "md file + sections + table = markdown-creator."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Create a PRD for the new checkout flow."
    expected_trigger: false
    expected_sibling: prd-generation
    rationale: "PRD is a specific document type owned by prd-generation, not generic markdown."

  - id: P18
    bucket: negative_sibling
    text: "Write a tech spec describing the payment service architecture."
    expected_trigger: false
    expected_sibling: tech-specification
    rationale: "Tech spec = tech-specification's output contract, not generic markdown."

  - id: P19
    bucket: negative_sibling
    text: "Regenerate the CLAUDE.md project-context file to reflect the new folder layout."
    expected_trigger: false
    expected_sibling: project-context
    rationale: "CLAUDE.md regeneration is project-context's job: the skill's own skip list names it."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Add Redis caching in front of the product API."
    expected_trigger: false
    rationale: "Redis caching = caching-strategy, unrelated to markdown authoring."
