skill_name: image-generation
skill_id: SK-105
category: document
version: 1.0.0

target_description: |
  Generate logos, favicons, icons, illustrations, and UI mockups using Claude's native image generation. Use when creating a logo, favicon, app icon, illustration, or any visual asset for the project. Also triggers on: 'Generate image', 'Create logo', 'Create favicon', 'Generate icon', 'Create illustration', 'Design logo'.
# Likely sibling collisions:
#   - image-assets:     optimizes EXISTING images (compression/WebP/lazy)
#   - design-screens:   generates screen layouts (not individual assets)
#   - design-tokens:    color/typography tokens (not visual assets)

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Generate a logo for our new SaaS product."
    expected_trigger: true
    rationale: "'Generate a logo' is the primary trigger phrase."

  - id: P02
    bucket: positive_direct
    text: "Create a favicon for the site."
    expected_trigger: true
    rationale: "'Create a favicon' named in the description verbatim."

  - id: P03
    bucket: positive_direct
    text: "Generate the app icon in 1024x1024."
    expected_trigger: true
    rationale: "App icon generation named verbatim."

  - id: P04
    bucket: positive_direct
    text: "Create a hero illustration for the marketing homepage."
    expected_trigger: true
    rationale: "Illustration creation named verbatim."

  - id: P05
    bucket: positive_direct
    text: "Generate UI mockups of the dashboard screen."
    expected_trigger: true
    rationale: "UI mockup generation named verbatim."

  - id: P06
    bucket: positive_direct
    text: "Design a logo using Claude's native image generation."
    expected_trigger: true
    rationale: "Matches 'using Claude's native image generation' phrase exactly."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "We need a brand mark — can you whip one up based on our color palette?"
    expected_trigger: true
    rationale: "Brand mark creation = logo generation."

  - id: P08
    bucket: positive_paraphrase
    text: "Make an OG image for social-media sharing of the landing page."
    expected_trigger: true
    rationale: "OG image is a named visual asset the skill generates."

  - id: P09
    bucket: positive_paraphrase
    text: "Produce a set of icons for the settings, profile, and notification sections."
    expected_trigger: true
    rationale: "Icon production = icon generation."

  - id: P10
    bucket: positive_paraphrase
    text: "Draw up an illustration showing three users collaborating on a document."
    expected_trigger: true
    rationale: "Illustration drawing = illustration generation."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "We're kicking off a new project and need a visual identity — start with the logo."
    expected_trigger: true
    rationale: "Visual identity kickoff = logo generation."

  - id: P12
    bucket: positive_task_embedded
    text: "Our mobile app is missing an icon for the App Store submission."
    expected_trigger: true
    rationale: "App Store icon = app icon generation."

  - id: P13
    bucket: positive_task_embedded
    text: "Placeholder image of a friendly customer support person — something warm, neutral skin tone, for the empty state."
    expected_trigger: true
    rationale: "Placeholder illustration = illustration generation."

  - id: P14
    bucket: positive_task_embedded
    text: "Marketing wants a fresh social-share banner for the Black Friday launch."
    expected_trigger: true
    rationale: "Social-share banner = visual asset generation (OG image)."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now create the logo."
    expected_trigger: true
    rationale: "Direct 'create a logo' trigger phrase."

  - id: P16
    bucket: positive_context_based
    text: "Generate the favicon next."
    expected_trigger: true
    rationale: "Direct favicon-generation trigger."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Optimize the existing logo PNG — convert it to WebP and add srcset."
    expected_trigger: false
    expected_sibling: image-assets
    rationale: "WebP conversion + srcset on an EXISTING asset = image-assets (optimize), not image-generation (create new)."

  - id: P18
    bucket: negative_sibling
    text: "Compress the product photos and add lazy loading across the catalog."
    expected_trigger: false
    expected_sibling: image-assets
    rationale: "Compression + lazy-loading of existing photos = image-assets."

  - id: P19
    bucket: negative_sibling
    text: "Replace all hero images with lighter versions and serve AVIF where supported."
    expected_trigger: false
    expected_sibling: image-assets
    rationale: "AVIF swap-in on existing heroes = image-assets optimization, not generation."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write a PRD for the new onboarding flow."
    expected_trigger: false
    rationale: "PRD authoring = prd-generation, unrelated to image generation."
