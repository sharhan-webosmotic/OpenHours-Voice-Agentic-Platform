skill_name: pdf
skill_id: SK-048
category: document
version: 1.0.0

target_description: |
  Read, extract, merge, split, rotate, watermark, and create PDF files. Fill PDF forms, encrypt/decrypt, extract images, OCR scanned PDFs. Use when working with .pdf files or producing PDF documents.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Merge these three PDF files into one document."
    expected_trigger: true
    rationale: "Merging PDF files is the first verb in the description."

  - id: P02
    bucket: positive_direct
    text: "Split this PDF into separate pages."
    expected_trigger: true
    rationale: "Split is a named capability on PDF files."

  - id: P03
    bucket: positive_direct
    text: "Add a watermark to every page of this .pdf."
    expected_trigger: true
    rationale: "Watermarking .pdf files is explicitly in the description."

  - id: P04
    bucket: positive_direct
    text: "Run OCR on a scanned PDF and extract the text."
    expected_trigger: true
    rationale: "OCR on scanned PDFs is directly named."

  - id: P05
    bucket: positive_direct
    text: "Fill out this PDF form with applicant data."
    expected_trigger: true
    rationale: "Fill PDF forms is a direct capability."

  - id: P06
    bucket: positive_direct
    text: "Encrypt this PDF with a password."
    expected_trigger: true
    rationale: "Encrypt/decrypt PDFs is in the description."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Combine two PDFs back-to-back into a single file."
    expected_trigger: true
    rationale: "Combining PDFs = merging PDFs."

  - id: P08
    bucket: positive_paraphrase
    text: "Rotate pages 3 and 5 of this PDF to landscape."
    expected_trigger: true
    rationale: "Rotate pages is directly in the description."

  - id: P09
    bucket: positive_paraphrase
    text: "Pull all the embedded images out of this PDF."
    expected_trigger: true
    rationale: "Extract images from PDFs is named."

  - id: P10
    bucket: positive_paraphrase
    text: "Remove password protection from this secured PDF."
    expected_trigger: true
    rationale: "Decrypt PDFs is a direct capability."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "The client sent a batch of scanned invoices — we need the text machine-readable."
    expected_trigger: true
    rationale: "Scanned document OCR is pdf's role."

  - id: P12
    bucket: positive_task_embedded
    text: "We have 50 individual PDFs that need to be one bound document for the archive."
    expected_trigger: true
    rationale: "Combining multiple PDFs into one = merge PDFs."

  - id: P13
    bucket: positive_task_embedded
    text: "Stamp CONFIDENTIAL across every page of this contract PDF."
    expected_trigger: true
    rationale: "Stamping across pages = watermarking."

  - id: P14
    bucket: positive_task_embedded
    text: "Build a printable PDF invoice for each customer row in this list."
    expected_trigger: true
    rationale: "Producing PDF documents is a named capability."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now watermark it and split into chapters."
    expected_trigger: true
    rationale: "Watermark + split are both PDF-specific operations."

  - id: P16
    bucket: positive_context_based
    text: "OK, flatten this into a PDF for email delivery."
    expected_trigger: true
    rationale: "Producing a PDF document is pdf's role."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Create a Word document with headings and a table of contents."
    expected_trigger: false
    expected_sibling: docx
    rationale: "Word document with TOC belongs to docx, not pdf."

  - id: P18
    bucket: negative_sibling
    text: "Build a slide deck with speaker notes and a title slide."
    expected_trigger: false
    expected_sibling: pptx
    rationale: "Slide deck with speaker notes is pptx, not pdf."

  - id: P19
    bucket: negative_sibling
    text: "Create an Excel workbook with pivot tables and SUM formulas."
    expected_trigger: false
    expected_sibling: xlsx
    rationale: "Excel workbook with formulas is xlsx, not pdf."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Refactor this React component to use hooks instead of class state."
    expected_trigger: false
    rationale: "React refactor is unrelated to PDF processing."
