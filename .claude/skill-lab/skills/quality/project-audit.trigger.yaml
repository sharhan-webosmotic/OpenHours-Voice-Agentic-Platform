skill_name: project-audit
skill_id: SK-081
category: quality
version: 1.0.0

target_description: |
  Scan entire codebase for ghost features, API contract violations, code quality issues, security problems, and documentation drift. Use when auditing the project, running a health check, or finding issues. Also triggers on: 'Audit project', 'Code review', 'Find issues', 'Whats wrong, Project audit, Check codebase, Review code quality'.
# Likely sibling collisions:
#   - code-quality:         focused on quality issues: project-audit is broader
#   - audit:      focused on security: project-audit includes security but is broader
#   - milestone-validation: milestone-close gate bundle (different trigger moment)
#   - debugger:             trace issues: project-audit is a broad scan, not a trace

buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Audit the project — I want a full health check."
    expected_trigger: true
    rationale: "Matches 'auditing the project, running a health check' triggers verbatim."

  - id: P02
    bucket: positive_direct
    text: "Scan the codebase for ghost features and documentation drift."
    expected_trigger: true
    rationale: "Ghost features + documentation drift = project-audit signature terms."

  - id: P03
    bucket: positive_direct
    text: "Find issues across the project — API violations, dead code, doc drift, security, quality."
    expected_trigger: true
    rationale: "Names the exact 5-category audit scope."

  - id: P04
    bucket: positive_direct
    text: "Run a whole-repo audit to surface API contract violations and orphaned code."
    expected_trigger: true
    rationale: "Whole-repo + API contract violations = project-audit."

  - id: P05
    bucket: positive_direct
    text: "Check the whole codebase for inconsistencies and tech debt."
    expected_trigger: true
    rationale: "Whole-codebase scan for inconsistencies = project-audit's broad scope."

  - id: P06
    bucket: positive_direct
    text: "Run the project health check across all modules."
    expected_trigger: true
    rationale: "'Project health check' is in description."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Take inventory of everything that's wrong or outdated across the repo."
    expected_trigger: true
    rationale: "Repo-wide inventory of wrong/outdated items = project-audit."

  - id: P08
    bucket: positive_paraphrase
    text: "Find dead features and mismatches between docs and code."
    expected_trigger: true
    rationale: "Dead features + docs/code mismatch = ghost features + doc drift."

  - id: P09
    bucket: positive_paraphrase
    text: "Give me a broad sweep of technical debt across the project."
    expected_trigger: true
    rationale: "Broad technical debt sweep = project-audit scope."

  - id: P10
    bucket: positive_paraphrase
    text: "What's broken, unused, or undocumented across our code?"
    expected_trigger: true
    rationale: "Broken/unused/undocumented across code = project-audit scan."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Before we start the next quarter, I want a clean-slate audit of where the project stands."
    expected_trigger: true
    rationale: "Clean-slate audit = project-audit, not a single-dimension check."

  - id: P12
    bucket: positive_task_embedded
    text: "The repo has grown quickly — I need a health check to find anything we've let rot."
    expected_trigger: true
    rationale: "Repo-wide rot detection = project-audit."

  - id: P13
    bucket: positive_task_embedded
    text: "Audit the codebase for features we built but never actually ship or use."
    expected_trigger: true
    rationale: "Unused-built-features = ghost features = project-audit."

  - id: P14
    bucket: positive_task_embedded
    text: "Check if our API contract and the actual implementation still match anywhere."
    expected_trigger: true
    rationale: "API contract vs implementation drift = project-audit."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Run the audit."
    expected_trigger: true
    rationale: "Short trigger: most audit-related prompts go here by default."

  - id: P16
    bucket: positive_context_based
    text: "Project health check, please."
    expected_trigger: true
    rationale: "Matches 'running a health check' trigger."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Run the 17-point SonarQube checklist before coding begins."
    expected_trigger: false
    expected_sibling: code-quality
    rationale: "17-point SonarQube pre-coding = code-quality, not a broad audit."

  - id: P18
    bucket: negative_sibling
    text: "Do an OWASP Top 10 security audit on the auth module."
    expected_trigger: false
    expected_sibling: audit
    rationale: "OWASP Top 10 specifically on auth = audit, not project-wide audit."

  - id: P19
    bucket: negative_sibling
    text: "Run the full-suite milestone validation at close — code quality + security + a11y + perf + bundle size."
    expected_trigger: false
    expected_sibling: milestone-validation
    rationale: "Full-suite milestone close validation with that bundle = milestone-validation."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write the FRD acceptance criteria for the signup flow."
    expected_trigger: false
    rationale: "FRD acceptance criteria = prd-generation, unrelated to audits."
