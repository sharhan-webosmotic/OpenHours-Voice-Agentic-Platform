skill_name: python-testing
skill_id: SK-084
category: platform
version: 1.0.0

target_description: |
  Write pytest tests for FastAPI backends, async services, and AI provider integrations. Covers unit tests with AsyncMock, integration tests with httpx.AsyncClient, pytest-asyncio, fixtures, conftest patterns, and coverage targets. Use when writing Python tests, setting up pytest configuration, testing FastAPI endpoints, mocking async providers, or running QA for the ai-server. Also triggers on: 'Test Python', 'pytest async', 'Test FastAPI', 'Unit test Python', 'Integration test Python', 'Test coverage', 'Mock provider', 'Python QA', 'test ai-server'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Write pytest tests for the new FastAPI users endpoint."
    expected_trigger: true
    rationale: "Matches 'writing Python tests' + 'testing FastAPI endpoints' verbatim."

  - id: P02
    bucket: positive_direct
    text: "Add unit tests with AsyncMock for our async billing service."
    expected_trigger: true
    rationale: "AsyncMock + async services is named explicitly."

  - id: P03
    bucket: positive_direct
    text: "Set up pytest configuration and a conftest for the ai-server."
    expected_trigger: true
    rationale: "Matches 'setting up pytest configuration' and 'conftest patterns'."

  - id: P04
    bucket: positive_direct
    text: "Write an integration test using httpx.AsyncClient against the API."
    expected_trigger: true
    rationale: "httpx.AsyncClient integration tests are explicit in the description."

  - id: P05
    bucket: positive_direct
    text: "Mock the OpenAI async provider in our tests."
    expected_trigger: true
    rationale: "Matches 'mocking async providers' verbatim."

  - id: P06
    bucket: positive_direct
    text: "Run QA for the ai-server and hit our coverage targets."
    expected_trigger: true
    rationale: "Matches 'running QA for the ai-server' and 'coverage targets'."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Add pytest tests that exercise the FastAPI endpoint end-to-end with httpx."
    expected_trigger: true
    rationale: "pytest + FastAPI + httpx = this skill's exact stack."

  - id: P08
    bucket: positive_paraphrase
    text: "Stub the embeddings provider so the tests don't hit the network."
    expected_trigger: true
    rationale: "Stubbing an async provider for tests = mocking async providers."

  - id: P09
    bucket: positive_paraphrase
    text: "Bump our pytest coverage on the Python services layer."
    expected_trigger: true
    rationale: "pytest coverage on Python services is this skill's scope."

  - id: P10
    bucket: positive_paraphrase
    text: "Add shared fixtures so every test can grab an authed client."
    expected_trigger: true
    rationale: "Shared fixtures / conftest patterns are explicit in the description."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Before we merge this PR, add async unit tests for the new controller."
    expected_trigger: true
    rationale: "Async unit tests for a Python controller = python-testing."

  - id: P12
    bucket: positive_task_embedded
    text: "The RAG pipeline isn't verified — can you add pytest coverage for the retrieval step?"
    expected_trigger: true
    rationale: "Adding pytest coverage is python-testing regardless of subject under test."

  - id: P13
    bucket: positive_task_embedded
    text: "CI is green but we have no pytest for the FastAPI webhook handler — please add one with AsyncMock."
    expected_trigger: true
    rationale: "pytest + FastAPI + AsyncMock for a missing test = python-testing."

  - id: P14
    bucket: positive_task_embedded
    text: "Use AsyncMock to stub the async LLM provider so the agent orchestration pytest suite stays deterministic."
    expected_trigger: true
    rationale: "AsyncMock stubbing async providers inside pytest = python-testing."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Now write the pytest-asyncio tests for it."
    expected_trigger: true
    rationale: "pytest-asyncio is named explicitly in the description."

  - id: P16
    bucket: positive_context_based
    text: "OK, add the QA pass with AsyncMock next."
    expected_trigger: true
    rationale: "QA pass + AsyncMock = this skill."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Implement the async POST handler and Pydantic schema for invitations."
    expected_trigger: false
    expected_sibling: build
    rationale: "Implementing the handler itself is python-backend, not testing it."

  - id: P18
    bucket: negative_sibling
    text: "Add the Voyage embeddings provider implementation under src/integrations."
    expected_trigger: false
    expected_sibling: python-ai-services
    rationale: "New embeddings provider implementation = python-ai-services."

  - id: P19
    bucket: negative_sibling
    text: "Configure gunicorn workers and the Docker healthcheck for production."
    expected_trigger: false
    expected_sibling: python-deployment
    rationale: "Worker config + Docker healthcheck = python-deployment."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Write a Jira ticket summarizing our Q3 roadmap."
    expected_trigger: false
    rationale: "Roadmap ticket authoring is unrelated to Python testing."
