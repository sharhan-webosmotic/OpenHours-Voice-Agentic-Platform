skill_name: shadcn-ui
skill_id: SK-103
category: platform
version: 1.0.0

target_description: |
  Authoritative skill for any task naming a shadcn/ui component: adding, installing, searching the registry, fixing broken or misaligned behavior or styling, restyling, composing, or wiring up UI components. Component names that always route here: Dialog, Sheet, Drawer, Select, Combobox, Popover, Tooltip, Command, Button, Form, Toast, Tabs, plus Radix primitives. Use when the prompt names a shadcn component, even when the verb is 'fix', 'style', or 'align'. Do NOT use for: framework-agnostic React hooks (use reactjs), Next.js App Router/RSC (use nextjs), or new design tokens (use design-tokens).
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Add the shadcn Button and Dialog components to this project."
    expected_trigger: true
    rationale: "Adding shadcn/ui components is the primary capability."

  - id: P02
    bucket: positive_direct
    text: "Search the shadcn registry for a date-picker component."
    expected_trigger: true
    rationale: "Searching shadcn components is explicitly named."

  - id: P03
    bucket: positive_direct
    text: "Fix the shadcn Select — options aren't rendering correctly."
    expected_trigger: true
    rationale: "Fixing shadcn components is a named capability."

  - id: P04
    bucket: positive_direct
    text: "Compose a FieldGroup with three Fields for the profile form."
    expected_trigger: true
    rationale: "Forms (FieldGroup, Field) called out explicitly."

  - id: P05
    bucket: positive_direct
    text: "Restyle the shadcn component using semantic colors and proper gap spacing."
    expected_trigger: true
    rationale: "Styling (semantic colors, gap spacing) is explicitly named."

  - id: P06
    bucket: positive_direct
    text: "Install a component from the @magicui registry."
    expected_trigger: true
    rationale: "Multi-registry support (@magicui) is explicit in the description."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "Swap our custom modal for a shadcn Sheet — it should slide in from the right."
    expected_trigger: true
    rationale: "Overlays (Sheet) is an explicit capability; replace-with-shadcn is adding/composing."

  - id: P08
    bucket: positive_paraphrase
    text: "Wire up a Drawer that opens from the bottom on mobile."
    expected_trigger: true
    rationale: "Drawer overlay is named in the description."

  - id: P09
    bucket: positive_paraphrase
    text: "Convert these raw divs to use Radix primitives for keyboard accessibility."
    expected_trigger: true
    rationale: "Radix/base UI primitives are explicitly named."

  - id: P10
    bucket: positive_paraphrase
    text: "Add icons to the menu using data-icon attributes."
    expected_trigger: true
    rationale: "Icons (data-icon) explicitly in the description."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "The Dialog close button is misaligned — fix the styling."
    expected_trigger: true
    rationale: "Fixing + styling a shadcn Dialog overlay: named capabilities."

  - id: P12
    bucket: positive_task_embedded
    text: "Our shadcn form has uneven spacing between fields — apply the right gap tokens."
    expected_trigger: true
    rationale: "Forms + styling (gap spacing) both explicit."

  - id: P13
    bucket: positive_task_embedded
    text: "We need to pull in a hero animation from @tailark."
    expected_trigger: true
    rationale: "Multi-registry (@tailark) explicitly supported."

  - id: P14
    bucket: positive_task_embedded
    text: "Compose a Sheet that contains a FieldGroup form inside it."
    expected_trigger: true
    rationale: "Composing overlays + forms: both explicit."

  # ----- Positive: context-based (2) -----
  - id: P15
    bucket: positive_context_based
    text: "Add a Dialog for that confirmation."
    expected_trigger: true
    rationale: "Short follow-up: Dialog is a named shadcn overlay."

  - id: P16
    bucket: positive_context_based
    text: "Now search the registry for a combobox."
    expected_trigger: true
    rationale: "Registry search is an explicit capability."

  # ----- Negative: sibling confusion (3) -----
  - id: P17
    bucket: negative_sibling
    text: "Write a custom React hook to manage focus trap state."
    expected_trigger: false
    expected_sibling: reactjs
    rationale: "Custom hook authoring is reactjs's domain: not component-library management."

  - id: P18
    bucket: negative_sibling
    text: "Configure Server Components and 'use client' boundaries for this Next.js page."
    expected_trigger: false
    expected_sibling: nextjs
    rationale: "RSC/directives are Next.js-specific, not shadcn component work."

  - id: P19
    bucket: negative_sibling
    text: "Generate fresh design tokens (spacing, radii, typography) for the design system."
    expected_trigger: false
    expected_sibling: design-tokens
    rationale: "Creating design tokens is the design-tokens skill; shadcn-ui only consumes them."

  # ----- Negative: unrelated (1) -----
  - id: P20
    bucket: negative_unrelated
    text: "Optimize the PostgreSQL query plan for our reporting endpoint."
    expected_trigger: false
    rationale: "Database performance is unrelated to UI component management."
