skill_name: reactjs
skill_id: SK-087
category: platform
version: 1.0.0

target_description: |
  Authoritative skill for React.js-specific patterns: custom hooks, React.lazy and code splitting, useMemo/useCallback memoization, Context API, React Hook Form with Zod, forwardRef, class-to-hooks conversion, and re-render performance tuning. Use whenever the task names React primitives or asks to build, refactor, or optimize a React component or app. Do NOT use for: Next.js App Router or Server Components (use nextjs), shadcn/ui (use shadcn-ui), Playwright E2E (use e2e-testing), or non-React tasks (use build). Also triggers on: 'Zustand store', 'React testing'.
buckets:
  positive_direct: 6
  positive_paraphrase: 4
  positive_task_embedded: 4
  positive_context_based: 2
  negative_sibling: 3
  negative_unrelated: 1

prompts:

  # ----- Positive: direct phrasings (6) -----
  - id: P01
    bucket: positive_direct
    text: "Write a custom React hook for debouncing input values."
    expected_trigger: true
    rationale: "Custom hooks is a named capability in the description."

  - id: P02
    bucket: positive_direct
    text: "Set up form handling with React Hook Form and Zod validation."
    expected_trigger: true
    rationale: "Form handling (RHF+Zod) is explicitly called out in the description."

  - id: P03
    bucket: positive_direct
    text: "Help me architect a React application — what project structure should I use?"
    expected_trigger: true
    rationale: "Project structure + architecting React applications both named verbatim."

  - id: P04
    bucket: positive_direct
    text: "Optimize this React component's performance — too many re-renders."
    expected_trigger: true
    rationale: "Performance optimization is a named capability."

  - id: P05
    bucket: positive_direct
    text: "Build a compound component pattern for our Tabs widget."
    expected_trigger: true
    rationale: "Compound components is explicitly in the description."

  - id: P06
    bucket: positive_direct
    text: "Show me how to use forwardRef properly in a typed React component."
    expected_trigger: true
    rationale: "Ref patterns and TypeScript generics both in the description."

  # ----- Positive: paraphrases (4) -----
  - id: P07
    bucket: positive_paraphrase
    text: "What's the best way to share state between unrelated components in a React app?"
    expected_trigger: true
    rationale: "Context API / state patterns: paraphrased."

  - id: P08
    bucket: positive_paraphrase
    text: "Wrap this heavy component with React.lazy so it code-splits."
    expected_trigger: true
    rationale: "Code splitting is a listed capability; React.lazy is the primitive."

  - id: P09
    bucket: positive_paraphrase
    text: "Memoize this expensive calculation so it doesn't re-compute on every render."
    expected_trigger: true
    rationale: "Performance optimization via useMemo: paraphrased."

  - id: P10
    bucket: positive_paraphrase
    text: "How do I use the new React 19 `use` hook for reading promises?"
    expected_trigger: true
    rationale: "React 18/19 APIs: paraphrased."

  # ----- Positive: task-embedded (4) -----
  - id: P11
    bucket: positive_task_embedded
    text: "Our React app has a deeply-nested prop-drilling problem — refactor it."
    expected_trigger: true
    rationale: "Prop drilling implies Context API / state patterns: React-specific architecture."

  - id: P12
    bucket: positive_task_embedded
    text: "I'm building a reusable Modal component in React — how should I structure the API?"
    expected_trigger: true
