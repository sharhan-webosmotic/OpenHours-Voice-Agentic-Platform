# AI_DOCS/architecture/authz-matrix.yaml
# Machine-readable RBAC source of truth. Generated by the authz-matrix skill from
# tech-spec S3 (roles + permissions), S7 (data-model fields), and api-contract.md
# (each endpoint tagged with the resource.action it enforces). LOCKED after Gate 1
# (enforce-artifact-lock.sh): changes route through /change-request, never a hand-edit.
#
# This is the SINGLE SOURCE OF TRUTH for RBAC. Every test (API + Playwright UI) is
# GENERATED from this file, so updating a permission = editing one cell here and
# regenerating, never hand-patching N test files. /build and the authz validator
# check against this, so a wrong-role guard, a missing cross-tenant filter, or a
# leaked field is caught by a test instead of slipping past a "a role word appears" grep.
#
# Action cell values (matrix:):
#   allow         : the role may perform the action on any in-scope record
#   deny          : the role is forbidden (API expects 403, UI control must be absent/disabled)
#   own-only      : only on records it owns; another user's record returns 403/404
#   tenant-scoped : only within its own tenant; a cross-tenant record returns 403/404
#
# Field cell values (fields:):
#   write  : the role sees the field AND may edit it (UI input editable, API write accepted)
#   read   : the role sees it read-only (UI rendered, no input; API write rejected 403/422)
#   masked : the role sees a masked value only (e.g. ***-**-1234); raw value never in DOM or response
#   none   : the role does not see the field at all (absent from the DOM and the API response)
#
# DOM bridge convention (makes the Playwright element-finding robust, not brittle):
#   - every permission-gated ACTION control carries  data-perm="<resource>.<action>"
#       e.g. <button data-perm="case.delete">Delete</button>
#   - every permission-gated FIELD element carries    data-perm-field="<resource>.<field>"
#       e.g. <input data-perm-field="employee.salary" />
#   The generated Playwright suite locates elements by these attributes (never brittle CSS),
#   so adding a gated element = add the attribute + a matrix/fields cell, nothing else.
#   /build's RBAC gate checks that gated controls carry the attribute.

version: 2

# Access-control model:
#   static  : a FIXED set of roles, each a FIXED permission bundle. Checking by role is fine.
#   dynamic : roles/permissions are created and toggled at RUNTIME (custom roles, per-user grants).
#             Access MUST be decided by the PERMISSION the user effectively holds, NEVER by role
#             name or id (two users with the same role name can hold different permissions, and a
#             custom role is an arbitrary bundle of checkmarks). In dynamic mode the permissions /
#             requires / fields_require / role_permissions / personas blocks are the SOURCE OF TRUTH
#             and the role->decision `matrix:` below is a derived convenience view (a cell must equal
#             what role_permissions[role] intersect requires[action] implies, else it is a spec bug).
mode: dynamic            # static | dynamic  (set dynamic when the project has runtime role/permission management)

# Roles come from tech-spec S3. Order is least to most privileged.
roles: [guest, member, manager, admin, super_admin]

# === Permission-based (PBAC) source of truth (used when mode: dynamic) ========================
# The atomic capabilities (the permission checkmarks). Access is decided by THESE, not by role.
permissions:
  - case.list
  - case.create
  - case.read
  - case.update
  - case.delete
  - case.notes.read       # field-level capability (the internal notes)
  - case.status.write     # field-level capability (changing status)
  - case.ssn.read         # field-level capability (unmasked SSN)
  - user.manage           # the permission-management capability itself (makes a persona Actor A)
  - user.read             # search / list users (a DEPENDENCY of assign-style actions)
  - project.assign        # assign a project to a user (needs user.read to search them)

# Permission DEPENDENCIES (a DAG). A permission is only FUNCTIONAL when its dependencies are
# also held. The EFFECTIVE requirement for an action is the dependency CLOSURE of its required
# permission(s). Holding a permission without its dependency is a broken grant: the dependent
# capability must be correctly DISABLED (not broken-but-clickable), and granting the permission
# must handle the dependency (auto-grant it, require it, or disable the feature).
permission_dependencies:
  project.assign: [user.read]    # you cannot assign a project to a user you cannot search for
  # case.notes.write: [case.read]

# What each action REQUIRES. An action is ALLOWED iff the caller's effective permission set
# includes ALL of these AND the closure of their permission_dependencies (own-only /
# tenant-scoped still constrain SCOPE on top of the permission).
requires:
  case.list:   [case.list]
  case.create: [case.create]
  case.read:   [case.read]
  case.update: [case.update]
  case.delete: [case.delete]

# Field read/write capability requirements (the field-level checkmarks). A field with no entry
# inherits the resource read permission; a field with a read perm the persona lacks renders
# masked (if a mask is defined) or none.
fields_require:
  case.assignee_notes: { read: case.notes.read, write: case.notes.read }
  case.status:         { read: case.read,        write: case.status.write }
  case.client_ssn:     { read: case.ssn.read }    # without case.ssn.read -> masked, never raw

# A FIXED role is a FIXED permission bundle. In dynamic mode these are the seeded defaults;
# custom roles and per-user grants layer on top of them.
role_permissions:
  guest:       []
  member:      [case.list, case.create, case.read, case.update]
  manager:     [case.list, case.create, case.read, case.update, case.status.write]
  admin:       [case.list, case.create, case.read, case.update, case.delete, case.notes.read, case.status.write, case.ssn.read, user.manage]
  super_admin: [case.list, case.create, case.read, case.update, case.delete, case.notes.read, case.status.write, case.ssn.read, user.manage]

# Test PERSONAS for dynamic mode. A persona is defined by its EFFECTIVE PERMISSION SET, NOT a role
# name. The generated tests validate access by these permissions. Three kinds:
#   role         : a named fixed role           (effective = role_permissions[role])
#   custom_role  : an arbitrary runtime bundle  (effective = the listed permissions)
#   base         : a base role + direct grants  (effective = role_permissions[role] + grants - revokes)
# NOTE: member_user and member_plus_delete share the role NAME "member" but differ by one permission,
# so a guard that checks `role === 'member'` is WRONG for them. That is the point of dynamic mode.
personas:
  - { id: member_user,        kind: role,        role: member }
  - { id: custom_auditor,     kind: custom_role, permissions: [case.list, case.read, case.ssn.read] }   # read-only + SSN, no create/update/delete
  - { id: member_plus_delete, kind: base,        role: member, grants: [case.delete] }                  # same role NAME as member, MORE access
  - { id: admin_minus_delete, kind: base,        role: admin,  revokes: [case.delete] }                 # same role NAME as admin, LESS access
# ============================================================================================

# Permission-management capability (drives the dynamic two-actor flow, Step 6).
# A role under `manages` can change another user's role/permissions, so it is the
# "Actor A" that grants/revokes; the rest are "Actor B" targets. A role that manages
# nothing is only ever a target, never the changer.
manages:
  admin:        [roles, permissions]
  super_admin:  [roles, permissions]
# The real admin screen + controls the dynamic flow drives to make the change
# (located by data-perm, never brittle CSS).
manage_ui:
  screen: /admin/users/:id/permissions
  role_control: 'data-perm="user.role.set"'
  perm_control: 'data-perm-field="user.permission.toggle"'

# Each protected api-contract endpoint mapped to the resource.action it enforces.
# Endpoints marked public in the contract are omitted.
endpoints:
  - { method: GET,    path: /api/v1/cases,     resource_action: case.list }
  - { method: POST,   path: /api/v1/cases,     resource_action: case.create }
  - { method: GET,    path: /api/v1/cases/:id, resource_action: case.read }
  - { method: PATCH,  path: /api/v1/cases/:id, resource_action: case.update }
  - { method: DELETE, path: /api/v1/cases/:id, resource_action: case.delete }

# UI routes that expose gated controls/fields, so the Playwright layer knows where to look.
# resource -> the screens that render its data-perm / data-perm-field elements.
screens:
  case:
    list: /cases
    detail: /cases/:id
    create: /cases/new
    edit: /cases/:id/edit

# (resource.action) x role -> decision. Every endpoint above must have a row here,
# and every role must have a cell (no blanks: an unstated cell is a generation bug).
matrix:
  case.list:
    guest: deny
    member: own-only
    manager: tenant-scoped
    admin: allow
    super_admin: allow
  case.create:
    guest: deny
    member: allow
    manager: allow
    admin: allow
    super_admin: allow
  case.read:
    guest: deny
    member: own-only
    manager: tenant-scoped
    admin: allow
    super_admin: allow
  case.update:
    guest: deny
    member: own-only
    manager: tenant-scoped
    admin: allow
    super_admin: allow
  case.delete:
    guest: deny
    member: deny
    manager: deny
    admin: allow
    super_admin: allow

# (resource.field) x role -> visibility/editability. Sourced from S7 fields + S3.
# Every gated field gets a cell for every role (no blanks). Fields with no role
# restriction (always visible+editable to anyone who can read the resource) need
# not be listed, but any field carrying PII or a privileged value MUST appear here.
fields:
  case.title:
    guest: none
    member: write
    manager: write
    admin: write
    super_admin: write
  case.status:
    guest: none
    member: read        # member sees status, only a manager+ changes it
    manager: write
    admin: write
    super_admin: write
  case.assignee_notes:
    guest: none
    member: none        # internal notes hidden from the member
    manager: write
    admin: write
    super_admin: write
  case.client_ssn:
    guest: none
    member: masked      # member sees ***-**-1234
    manager: masked
    admin: read
    super_admin: read
