name: CI

on:
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # corepack must never block waiting for a download confirmation on CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: openhours
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: openhours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openhours -d openhours_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Synthetic CI database only. Real or production data never reaches CI.
      DATABASE_URL: postgresql://openhours:postgres_ci_only@localhost:5432/openhours_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 auto-enables package-manager caching when package.json has a
          # `packageManager` field, and that cache restore shells out to `pnpm store
          # path` before pnpm exists, failing with "Unable to locate executable file:
          # pnpm". pnpm is installed by the next step, so the automatic cache is turned
          # off and the pnpm store is cached explicitly below instead.
          package-manager-cache: false

      # pnpm 12 ships bin/pnpm.mjs, which the corepack bundled with Node cannot load
      # (it looks for bin/pnpm.cjs). Pin a corepack new enough to run it.
      - name: Install pnpm via corepack
        run: |
          npm install -g --force corepack@0.36.0
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      # `apps/api/src/generated/` is git-ignored, so a fresh checkout has no Prisma
      # client. `pnpm lint` is `eslint .` at the root rather than a Turbo task, so it
      # does not inherit the `generate` dependency that typecheck, test and build have.
      # Without this step the typed lint rules see PrismaClient as an unresolved type
      # and `no-unsafe-*` fires on every call through it.
      - name: Generate the Prisma client
        run: pnpm generate

      # The database lock is only trustworthy if it is checked. These run against the
      # postgres service with the real migrations, so a tenant table added without a
      # policy fails the build rather than shipping readable across organisations.
      # Testcontainers starts its own PostgreSQL for the database suites. Checked
      # explicitly so a runner without Docker fails here with a clear reason instead of
      # as an opaque container-start timeout several minutes into `pnpm test`.
      - name: Check Docker is available for Testcontainers
        run: docker info --format 'docker {{.ServerVersion}} available'

      # The service container is fresh for every job, so these three steps prove the
      # migrations and the hand-written SQL apply to a genuinely CLEAN database,
      # independently of the test harness doing the same thing in its own container.
      #
      # Run through the ROOT scripts, the same ones a developer runs, so CI and local
      # cannot drift apart.
      - name: Apply migrations to a clean database
        run: pnpm db:migrate

      - name: Apply hand-written SQL (constraints, RLS, roles)
        run: pnpm db:sql
        env:
          APP_USER_PASSWORD: app_user_ci_only

      - name: Row-level security policy coverage
        run: pnpm db:check-policies

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs both vitest projects: the unit suite, and the database suite which starts
      # its own PostgreSQL via Testcontainers, applies the real migrations and the real
      # hand-written SQL, and connects as the non-owner app_user so row-level security
      # is live.
      - name: Test
        run: pnpm test

      - name: OpenAPI drift
        run: pnpm openapi:check

      - name: Build
        run: pnpm build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # See the comment in the verify job.
          package-manager-cache: false

      - name: Install pnpm via corepack
        run: |
          npm install -g --force corepack@0.36.0
          corepack enable
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails the build on any high or critical advisory.
      - name: Audit
        run: pnpm audit --audit-level high
